name: M5 local guest admission

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m5-local-guest-supervisor
  cancel-in-progress: false

jobs:
  admission:
    if: github.ref == 'refs/heads/master' && github.ref_protected
    environment: m5-mini-release-rehearsal
    runs-on: [self-hosted, macOS, ARM64, norn-m5-supervisor]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - name: Require exact protected supervisor
        run: |
          set -euo pipefail
          [[ "$RUNNER_NAME" == norn-m5-supervisor-01 ]]
          [[ "$GITHUB_REF" == refs/heads/master && "$GITHUB_REF_PROTECTED" == true ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
      - name: Check signed one-use guest admission without guest effects
        env:
          INTENT: ${{ vars.M5_LOCAL_GUEST_INTENT }}
          SIGNATURE: ${{ vars.M5_LOCAL_GUEST_SIGNATURE }}
          PUBLIC_KEY: ${{ vars.M5_LOCAL_GUEST_PUBLIC_KEY }}
          TART: ${{ vars.M5_LOCAL_TART }}
          PACKER: ${{ vars.M5_LOCAL_PACKER }}
          PLUGIN: ${{ vars.M5_LOCAL_TART_PACKER_PLUGIN }}
          SOFTNET: ${{ vars.M5_LOCAL_SOFTNET }}
          IPSW: ${{ vars.M5_LOCAL_IPSW }}
          VOLUME: ${{ vars.M5_LOCAL_VOLUME }}
        run: |
          set -euo pipefail
          for key in INTENT SIGNATURE PUBLIC_KEY TART PACKER PLUGIN SOFTNET IPSW VOLUME; do
            [[ -n "${!key}" ]]
          done
          test -x "$GITHUB_WORKSPACE/v2/scripts/mini-m5-local-guest-controller"
          python3 "$GITHUB_WORKSPACE/v2/scripts/mini-m5-local-guest-controller" preflight \
            --intent "$INTENT" --signature "$SIGNATURE" --public-key "$PUBLIC_KEY" \
            --tart "$TART" --packer "$PACKER" --plugin "$PLUGIN" \
            --softnet "$SOFTNET" --ipsw "$IPSW" --volume "$VOLUME"
