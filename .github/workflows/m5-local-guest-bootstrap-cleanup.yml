name: M5 local guest bootstrap cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m5-historical-copied-state
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/master' && github.ref_protected
    environment: m5-mini-release-rehearsal
    runs-on: norn-m5-isolated
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - name: Require exact protected guest runner and helper
        run: |
          set -euo pipefail
          [[ "$RUNNER_NAME" == norn-m5-isolated-01 ]]
          [[ "$GITHUB_REF" == refs/heads/master && "$GITHUB_REF_PROTECTED" == true ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          helper=/Library/PrivilegedHelperTools/norn-mini-m5-bootstrap-cleanup
          HELPER="$helper" python3 - <<'PY'
          import hashlib, os, stat
          path = os.environ['HELPER']
          for parent in ('/', '/Library', '/Library/PrivilegedHelperTools'):
              info = os.lstat(parent)
              assert info.st_uid == 0 and stat.S_ISDIR(info.st_mode) and not stat.S_IMODE(info.st_mode) & 0o022
          info = os.lstat(path)
          assert info.st_uid == 0 and stat.S_ISREG(info.st_mode) and not stat.S_IMODE(info.st_mode) & 0o022
          with open(path, 'rb') as source:
              assert hashlib.sha256(source.read()).hexdigest() == '44427347c24f21d590f2adf636e407fb17feca1047c5b915b280b356a2377ed3'
          PY
      - name: Remove bootstrap SSH and admin account inside guest
        env:
          INTENT_B64: ${{ vars.M5_BOOTSTRAP_CLEANUP_INTENT_B64 }}
          SIGNATURE_B64: ${{ vars.M5_BOOTSTRAP_CLEANUP_SIGNATURE_B64 }}
          PUBLIC_KEY_B64: ${{ vars.M5_BOOTSTRAP_CLEANUP_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for name, value in (('intent', 'INTENT_B64'), ('signature', 'SIGNATURE_B64'), ('public-key', 'PUBLIC_KEY_B64')):
              encoded = os.environ.get(value, '')
              if not encoded:
                  raise SystemExit('M5 cleanup signed input is absent: ' + value)
              data = base64.b64decode(encoded, validate=True)
              path = root / ('m5-bootstrap-cleanup-' + name)
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              with os.fdopen(fd, 'wb') as output:
                  output.write(data)
          PY
          sudo -n /Library/PrivilegedHelperTools/norn-mini-m5-bootstrap-cleanup \
            "$RUNNER_NAME" "$GITHUB_RUN_ID" "$GITHUB_SHA" \
            "$RUNNER_TEMP/m5-bootstrap-cleanup-intent" \
            "$RUNNER_TEMP/m5-bootstrap-cleanup-signature" \
            "$RUNNER_TEMP/m5-bootstrap-cleanup-public-key" \
            | tee "$RUNNER_TEMP/m5-bootstrap-cleanup.json" >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m5-bootstrap-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/m5-bootstrap-cleanup.json
          if-no-files-found: error
          retention-days: 30
