          NORN_GITHUB_ACTIONS_OIDC_AUDIENCE: ${{ vars.NORN_GITHUB_ACTIONS_OIDC_AUDIENCE }}
          REPOSITORY_VISIBILITY: ${{ needs.validate.outputs.repository_visibility }}
        run: |
          set -euo pipefail
          mkdir -p norn-release
          api="${NORN_API_URL%/}"
          oidc_token="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$NORN_GITHUB_ACTIONS_OIDC_AUDIENCE" | jq -er '.value')"
          NORN_API_TOKEN="$(curl --fail-with-body --silent --show-error --retry 3 --retry-connrefused -X POST "$api/api/v1/auth/github-actions/exchange" -H "Authorization: Bearer $oidc_token" -H 'Content-Type: application/json' -H 'Cache-Control: no-store' --data '{"scope":"release:qualify","app":"'"$APP_ID"'","environment":"staging","intent":"requalify"}' | jq -er '.token')"
          echo "::add-mask::$NORN_API_TOKEN"
          request="$(jq -nc --arg deploymentId "$DEPLOYMENT_ID" '{deploymentId: $deploymentId}')"
          curl --fail-with-body --silent --show-error --retry 3 --retry-connrefused \
            -X POST "$api/api/v1/apps/$APP_ID/qualifications" \
            -H "Authorization: Bearer $NORN_API_TOKEN" \
            -H 'Content-Type: application/json' \
            -H "Idempotency-Key: norn-staging-requalification-$APP_ID-$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --data "$request" > norn-release/qualification.json
          jq -e --arg app "$APP_ID" --arg sourceSha "$SOURCE_SHA" --arg deploymentId "$DEPLOYMENT_ID" --arg repositoryVisibility "$REPOSITORY_VISIBILITY" '
            .schemaVersion == "norn.release-qualification/v2" and
            .app == $app and .environment == "staging" and
            .sourceSha == $sourceSha and .deploymentId == $deploymentId and
            (.artifact | test("^.+@sha256:[0-9a-f]{64}$")) and
            (.keyId | type == "string" and length > 0) and
            (.signature | type == "string" and length > 0) and
            (.candidate.provider == "github-actions") and
            ((($repositoryVisibility == "public") and (.candidate.attestation.mode == "github-public")) or
             (($repositoryVisibility == "private" or $repositoryVisibility == "internal") and
              (.candidate.attestation.mode == "github-private" or .candidate.attestation.mode == "norn-signed-private"))) and
            (.candidate.attestation.subjectDigest == (.artifact | split("@") | .[1])) and
            (.candidate.attestation.materialSha == .sourceSha) and
            (.dsse.payloadType == "application/vnd.norn.release-qualification.v2+json") and
            (.dsse.payload | type == "string" and length > 0) and
            (.dsse.signatures | type == "array" and length == 1 and (.[0].keyid | startswith("ed25519:")) and (.[0].sig | type == "string" and length > 0))
          ' norn-release/qualification.json >/dev/null

      - name: Export the fresh staging qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: norn-qualification-${{ inputs.app_id }}-${{ inputs.source_sha }}
          path: norn-release/qualification.json
          if-no-files-found: error
          retention-days: 7

      - name: Write requalification summary
        run: |
          {
            echo '### Norn staging requalification'
            echo
            echo "- App: \`$APP_ID\`"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Existing staging deployment: \`$DEPLOYMENT_ID\`"
            echo '- No checkout, build, image signing, preflight, or deployment ran.'
          } >> "$GITHUB_STEP_SUMMARY"

  rollback:
    if: inputs.lane == 'rollback'
    needs: validate
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      deployments: write
      id-token: write
    concurrency:
      group: norn-release-${{ inputs.app_id }}-production
      cancel-in-progress: false
    env:
      APP_ID: ${{ inputs.app_id }}
      SOURCE_SHA: ${{ inputs.rollback_source_sha }}
      DEPLOYMENT_ID: ${{ inputs.rollback_deployment_id }}
      ARTIFACT: ${{ inputs.rollback_artifact }}
    steps:
      - name: Validate rollback environment configuration
        env:
          NORN_API_URL: ${{ vars.NORN_API_URL }}
          NORN_GITHUB_ACTIONS_OIDC_AUDIENCE: ${{ vars.NORN_GITHUB_ACTIONS_OIDC_AUDIENCE }}
        run: |
          set -euo pipefail
          [[ "$NORN_API_URL" == https://* ]] || { echo "NORN_API_URL must be an https URL" >&2; exit 1; }
          [[ -n "$NORN_GITHUB_ACTIONS_OIDC_AUDIENCE" ]] || { echo "NORN_GITHUB_ACTIONS_OIDC_AUDIENCE environment variable is required" >&2; exit 1; }

      - name: Record GitHub production rollback deployment
        id: github-deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/deployments" \
            -f ref="$SOURCE_SHA" -f environment=production -f task=norn-production-rollback \
            -F auto_merge=false -F transient_environment=false -F production_environment=true --jq '.id')"
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "GitHub did not return a deployment ID" >&2; exit 1; }
          gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
            -f state=in_progress -f environment=production \
            -f description="Norn rollback queued for $ARTIFACT" >/dev/null
          printf 'id=%s\n' "$id" >> "$GITHUB_OUTPUT"

      - name: Queue and wait for the exact Norn rollback
        id: queue
        env:
          NORN_API_URL: ${{ vars.NORN_API_URL }}
          NORN_GITHUB_ACTIONS_OIDC_AUDIENCE: ${{ vars.NORN_GITHUB_ACTIONS_OIDC_AUDIENCE }}
          GITHUB_DEPLOYMENT_ID: ${{ steps.github-deployment.outputs.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          github_status() {
            gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$GITHUB_DEPLOYMENT_ID/statuses" \
              -f state="$1" -f environment=production -f description="$2" >/dev/null || true
          }
          trap 'github_status failure "Norn rollback failed"' ERR
          api="${NORN_API_URL%/}"
          exchange_token() {
            oidc_token="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$NORN_GITHUB_ACTIONS_OIDC_AUDIENCE" | jq -er '.value')"
            curl --fail-with-body --silent --show-error --retry 3 --retry-connrefused -X POST "$api/api/v1/auth/github-actions/exchange" -H "Authorization: Bearer $oidc_token" -H 'Content-Type: application/json' -H 'Cache-Control: no-store' --data '{"scope":"release:rollback","app":"'"$APP_ID"'","environment":"production","intent":"rollback"}' | jq -er '.token'
          }
          NORN_API_TOKEN="$(exchange_token)"
          echo "::add-mask::$NORN_API_TOKEN"
          token_issued=$SECONDS
          request="$(jq -nc --arg deploymentId "$DEPLOYMENT_ID" --arg sourceSha "$SOURCE_SHA" --arg artifact "$ARTIFACT" \
            '{deploymentId: $deploymentId, sourceSha: $sourceSha, artifact: $artifact, confirm: true}')"
          curl --fail-with-body --silent --show-error --retry 3 --retry-connrefused \
            -X POST "$api/api/v1/apps/$APP_ID/releases/rollbacks" \
            -H "Authorization: Bearer $NORN_API_TOKEN" \
            -H 'Content-Type: application/json' \
            -H "Idempotency-Key: norn-production-rollback-$APP_ID-$DEPLOYMENT_ID-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --data "$request" > rollback.json
          operation_id="$(jq -er '.id' rollback.json)"
          deadline=$((SECONDS + 3600))
          while :; do
            if (( SECONDS - token_issued >= 600 )); then
              NORN_API_TOKEN="$(exchange_token)"
              echo "::add-mask::$NORN_API_TOKEN"
              token_issued=$SECONDS
            fi
            operation="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $NORN_API_TOKEN" "$api/api/v1/operations/$operation_id")"
            status="$(jq -er '.status' <<<"$operation")"
            case "$status" in
              succeeded) break ;;
              failed|canceled) jq -r '.lastError // .message // "rollback did not succeed"' <<<"$operation" >&2; exit 1 ;;
              queued|running) ;;
              *) echo "unexpected rollback status: $status" >&2; exit 1 ;;
            esac
            (( SECONDS < deadline )) || { echo "timed out waiting for rollback" >&2; exit 1; }
            sleep 10
          done
          github_status success "Norn restored the admitted $ARTIFACT"
          printf 'operation_id=%s\n' "$operation_id" >> "$GITHUB_OUTPUT"

      - name: Write production rollback summary
        run: |
          {
            echo '### Norn production rollback'
            echo
            echo "- App: \`$APP_ID\`"
            echo "- Restored source: \`$SOURCE_SHA\`"
            echo "- Restored artifact: \`$ARTIFACT\`"
            echo "- Norn operation: \`${{ steps.queue.outputs.operation_id }}\`"
            echo '- No checkout, build, tag, signing, or substitution ran.'
          } >> "$GITHUB_STEP_SUMMARY"
