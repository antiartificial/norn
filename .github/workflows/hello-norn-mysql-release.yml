name: Hello Norn MySQL release
run-name: hello-norn-mysql-release-${{ github.event.inputs.controller_intent_sha256 || github.sha }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current protected master commit to release
        required: true
        type: string
      m8_completion_receipt_sha256:
        description: Verified terminal M8 completion receipt SHA-256
        required: true
        type: string
      controller_intent_sha256:
        description: Exact signed Fleet controller intent hash for this one-use staging release
        required: true
        type: string
      owner_acknowledgement:
        description: Type release-hello-norn-mysql-staging-<source_sha>-<m8_receipt_sha256>
        required: true
        type: string

permissions: {}

jobs:
  staging:
    # Staging releases run only from a controller-signed dispatch after all
    # runtime and M8 qualification gates are satisfied; code pushes stay inert.
    if: >-
      github.repository == 'antiartificial/norn' &&
      github.ref == 'refs/heads/master' &&
      github.ref_protected &&
      vars.NORN_MANAGED_MYSQL_STAGING_RELEASE_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      github.actor == 'antiartificial' &&
      github.triggering_actor == 'antiartificial' &&
      inputs.source_sha == github.sha &&
      inputs.controller_intent_sha256 != '' &&
      inputs.m8_completion_receipt_sha256 != '' &&
      inputs.m8_completion_receipt_sha256 == vars.NORN_M8_COMPLETION_RECEIPT_SHA256 &&
      inputs.owner_acknowledgement == format('release-hello-norn-mysql-staging-{0}-{1}', github.sha, inputs.m8_completion_receipt_sha256)
    permissions:
      # GitHub validates every job in the reusable workflow, not only the
      # staging-lane jobs selected by its input. Keep this the exact union of
      # the permissions requested by the immutable callee pin below.
      actions: read
      checks: read
      contents: read
      deployments: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: antiartificial/norn/.github/workflows/norn-app-release.yml@1e70024ffec0781edbc3bfe54e12320b46b3e654
    with:
      lane: staging
      runner_private: true
      controller_intent_sha256: ${{ inputs.controller_intent_sha256 }}
      expected_runner_name: norn-work-staging-work${{ github.run_id }}-runner
      # Separate Norn-owned candidate; the serving direct Nomad job is not a
      # release target and remains available during qualification.
      app_id: hello-norn-mysql-managed
      image_repository: ghcr.io/antiartificial/hello-norn-mysql
      dockerfile: v2/infra/fleet-pilot/hello-norn-mysql/Dockerfile
      build_context: v2/infra/fleet-pilot/hello-norn-mysql
      build_contract: pilot-go
      go_image: golang@sha256:484ef6066fa69acb059fdfeda7ba2b8f7391f2ef6abc6f9b8411e669ebd56466
      runtime_image: gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
      required_checks: |
        Fleet pilot workload	15368

  production:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_protected
    permissions:
      actions: read
      checks: read
      contents: read
      deployments: write
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    uses: antiartificial/norn/.github/workflows/norn-app-release.yml@1d3f5802b5554e06ea1593146f00402d00ca9b2b
    with:
      lane: production
      app_id: hello-norn-mysql-managed
      image_repository: ghcr.io/antiartificial/hello-norn-mysql
