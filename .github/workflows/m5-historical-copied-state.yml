name: M5 historical copied-state restore

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact signed v2 source release SHA
        required: true
        type: string
      target_sha:
        description: Exact signed v3 target release SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: m5-historical-copied-state
  cancel-in-progress: false

jobs:
  restore:
    if: github.ref == 'refs/heads/master' && github.ref_protected
    environment: m5-mini-release-rehearsal
    runs-on: norn-m5-isolated
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - name: Require exact protected source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_REF" == refs/heads/master ]]
      - name: Require signed disposable guest qualification
        env:
          GUEST_NAME: ${{ vars.M5_LOCAL_GUEST_NAME }}
          CREATE_MARKER_SHA256: ${{ vars.M5_LOCAL_CREATE_MARKER_SHA256 }}
          QUALIFICATION_RECEIPT: ${{ vars.M5_LOCAL_QUALIFICATION_RECEIPT }}
          QUALIFICATION_SIGNATURE: ${{ vars.M5_LOCAL_QUALIFICATION_SIGNATURE }}
          QUALIFICATION_ATTESTATION: ${{ vars.M5_LOCAL_QUALIFICATION_ATTESTATION }}
          PUBLIC_KEY: ${{ vars.M5_LOCAL_GUEST_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          for key in GUEST_NAME CREATE_MARKER_SHA256 QUALIFICATION_RECEIPT QUALIFICATION_SIGNATURE QUALIFICATION_ATTESTATION PUBLIC_KEY; do
            [[ -n "${!key}" ]]
          done
          python3 "$GITHUB_WORKSPACE/v2/scripts/mini-m5-local-guest-qualification-gate" \
            --receipt "$QUALIFICATION_RECEIPT" --signature "$QUALIFICATION_SIGNATURE" \
            --public-key "$PUBLIC_KEY" --attestation "$QUALIFICATION_ATTESTATION" \
            --guest-name "$GUEST_NAME" --create-marker-sha256 "$CREATE_MARKER_SHA256" \
            --source-sha "$GITHUB_SHA"
      - name: Run isolated historical restore controller
        env:
          NORN_M5_HISTORICAL_ISOLATED: '1'
          NORN_M5_SOURCE_SHA: ${{ inputs.source_sha }}
          NORN_M5_TARGET_SHA: ${{ inputs.target_sha }}
          NORN_M5_ISOLATION_CHECK: /Library/PrivilegedHelperTools/norn-mini-m5-isolation-check
          NORN_M5_HISTORICAL_RECEIPT_DIR: ${{ vars.M5_HISTORICAL_RECEIPT_DIR }}
          NORN_REHEARSAL_POSTGRES_BIN: ${{ vars.M5_POSTGRES_BIN }}
          PROOF: ${{ vars.M5_BACKUP_PROOF }}
          DUMP: ${{ vars.M5_BACKUP_ARTIFACT }}
          OLD_RECEIPT: ${{ vars.M5_SHADOW_RECEIPT }}
          SOURCE_RELEASE_ROOT: ${{ vars.M5_SOURCE_RELEASE_ROOT }}
          TARGET_RELEASE_ROOT: ${{ vars.M5_TARGET_RELEASE_ROOT }}
          PUBLIC_KEY: ${{ vars.M5_PINNED_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_NAME" == norn-m5-isolated-01 ]]
          window=/Library/PrivilegedHelperTools/norn-mini-m5-firewall-window
          WINDOW="$window" python3 - <<'PY'
          import hashlib, os, stat
          path = os.environ['WINDOW']
          for parent in ('/', '/Library', '/Library/PrivilegedHelperTools'):
              info = os.lstat(parent)
              assert info.st_uid == 0 and stat.S_ISDIR(info.st_mode) and not stat.S_IMODE(info.st_mode) & 0o022
          info = os.lstat(path)
          assert info.st_uid == 0 and stat.S_ISREG(info.st_mode) and not stat.S_IMODE(info.st_mode) & 0o022
          with open(path, 'rb') as source:
              assert hashlib.sha256(source.read()).hexdigest() == 'b1661e155e0c1d069601275ad77bff3bbd5e9d155adee2f74ebeb0da137b38c1'
          PY
          window_enabled=false
          cleanup() {
            if [[ "$window_enabled" == true ]]; then
              sudo -n "$window" disable "$GITHUB_RUN_ID"
            fi
          }
          trap cleanup EXIT
          sudo -n "$window" admit "$GITHUB_RUN_ID"
          rehearsal_uid=$(id -u norn-m5-rehearsal)
          sudo -n -u norn-m5-rehearsal -- /bin/launchctl print "gui/$rehearsal_uid" >/dev/null
          sudo -n "$window" enable "$GITHUB_RUN_ID"
          window_enabled=true
          sudo -H -n -u norn-m5-rehearsal -- \
            /Library/PrivilegedHelperTools/norn-m5-historical/mini-historical-copied-state-controller \
            "$PROOF" "$DUMP" "$OLD_RECEIPT" \
            "$SOURCE_RELEASE_ROOT/$NORN_M5_SOURCE_SHA" "$TARGET_RELEASE_ROOT/$NORN_M5_TARGET_SHA" "$PUBLIC_KEY"
