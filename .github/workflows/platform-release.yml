name: Publish immutable platform release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA already merged to master
        required: true
        type: string

# Builds never receive secrets. Only the protected publish job receives the
# Ed25519 key and contents:write permission. Configure the `platform-release`
# environment with approval and NORN_RELEASE_SIGNING_KEY before first use.
permissions:
  contents: read

concurrency:
  group: platform-release-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Require protected master and exact commit
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/master" ]] || {
            echo "Run this workflow from master." >&2
            exit 1
          }
          [[ "$REF_PROTECTED" == "true" ]] || {
            echo "master must be protected before platform publishing is enabled." >&2
            exit 1
          }
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "commit_sha must be an exact lowercase 40-character SHA." >&2
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Require a commit merged to master
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$REQUESTED_SHA" ]]
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/master || {
            echo "The requested commit is not reachable from master." >&2
            exit 1
          }
          # Public repositories publish public, signed bundles. Private
          # repositories keep the same bundles private and require a read-only
          # host token. Authenticity never depends on repository visibility.
          gh api "repos/$GITHUB_REPOSITORY" --jq .visibility >/dev/null

  ui:
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: v2/ui/pnpm-lock.yaml
      - name: Build pinned UI
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$REQUESTED_SHA")"
          cd v2/ui
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-ui
          path: v2/ui/dist/
          if-no-files-found: error
          retention-days: 1

  bundle:
    needs: [authorize, ui]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: |
            v2/api/go.sum
            v2/cli/go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-ui
          path: ui-dist
      - name: Build deterministic platform bundle
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          source_epoch="$(git show -s --format=%ct "$REQUESTED_SHA")"
          created_at="$(git show -s --format=%cI "$REQUESTED_SHA")"
          version="$(git describe --tags --always "$REQUESTED_SHA")"
          release="$RUNNER_TEMP/release"
          bundle="$RUNNER_TEMP/bundle"
          mkdir -p "$release/bin" "$release/ui"
          cp -R ui-dist/. "$release/ui/"

          build_go() {
            module=$1
            output=$2
            package=$3
            ldflags=$4
            (
              cd "$module"
              env CGO_ENABLED=0 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" SOURCE_DATE_EPOCH="$source_epoch" \
                GOFLAGS= GOWORK=off GOENV=off GOEXPERIMENT= GOAMD64=v1 GOARM64=v8.0 \
                go build -trimpath -buildvcs=false -mod=readonly -ldflags "$ldflags" -o "$output" "$package"
            )
          }
          build_go v2/api "$release/bin/norn-api" . "-buildid= -X main.Version=$version"
          build_go v2/api "$release/bin/norn-host-agent" ./cmd/norn-host-agent "-buildid="
          build_go v2/cli "$release/bin/norn" . "-buildid= -X norn/v2/cli/cmd.Version=$version"
          for helper in \
            host-runtime \
            platform-release-artifact \
            platform-release-fetch-github \
            platform-release-manifest \
            platform-release-verify-github \
            platform-upgrade
          do
            install -m 0755 "v2/scripts/$helper" "$release/bin/$helper"
          done
          cat >"$release/release.env" <<EOF
          NORN_RELEASE_SHA=$REQUESTED_SHA
          NORN_RELEASE_VERSION=$version
          NORN_RELEASE_CREATED_AT=$created_at
          NORN_UI_DIR=ui
          EOF
          python3 v2/scripts/platform-release-manifest create \
            --release "$release" \
            --source "$GITHUB_WORKSPACE" \
            --sha "$REQUESTED_SHA" \
            --version "$version" \
            --created-at "$created_at" \
            --os "$TARGET_OS" \
            --arch "$TARGET_ARCH" \
            --go-version "$(go env GOVERSION)" \
            --node-version v24.19.0 \
            --node-required v24.19.0 \
            --pnpm-version 10.32.1 \
            --pnpm-required 10.32.1 \
            --go-flag=-trimpath \
            --go-flag=-buildvcs=false \
            --go-flag=-mod=readonly \
            --go-ldflag=-buildid= \
            "--go-ldflag=-X main.Version=$version" \
            "--go-ldflag=-X norn/v2/cli/cmd.Version=$version" \
            --go-environment=GOFLAGS= \
            --go-environment=GOWORK=off \
            --go-environment=GOENV=off \
            --go-environment=GOEXPERIMENT= \
            --go-environment=GOAMD64=v1 \
            --go-environment=GOARM64=v8.0 \
            --cgo-enabled 0 \
            --source-date-epoch "$source_epoch"
          SOURCE_DATE_EPOCH="$source_epoch" v2/scripts/platform-release-artifact package \
            --release-dir "$release" \
            --output-dir "$bundle" \
            --commit "$REQUESTED_SHA" \
            --os "$TARGET_OS" \
            --arch "$TARGET_ARCH" \
            --repository "$GITHUB_REPOSITORY" \
            --source-date-epoch "$source_epoch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/bundle/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    environment: platform-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secret-bearing job must execute release tooling from the
          # protected workflow ref, never from the historical commit being
          # packaged. Requested source code runs only in secretless jobs.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: platform-*-*
          path: release-bundles
      - name: Require GitHub release immutability
        env:
          GH_TOKEN: ${{ github.token }}
          # Fine-grained token: repository Administration (read) only. The
          # normal Actions job token cannot read this repository setting.
          NORN_RELEASE_IMMUTABILITY_CHECK_TOKEN: ${{ secrets.NORN_RELEASE_IMMUTABILITY_CHECK_TOKEN }}
        run: |
          set -euo pipefail
          immutability_token="${NORN_RELEASE_IMMUTABILITY_CHECK_TOKEN:-$GH_TOKEN}"
          [[ "$(GH_TOKEN="$immutability_token" gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled 2>/dev/null || true)" == "true" ]] || {
            echo "GitHub immutable releases must be enabled; configure the protected admin-read check token." >&2
            exit 1
          }
      - name: Sign, verify, and publish without overwriting
        env:
          GH_TOKEN: ${{ github.token }}
          NORN_RELEASE_SIGNING_KEY: ${{ secrets.NORN_RELEASE_SIGNING_KEY }}
          NORN_RELEASE_PUBLIC_KEY_PEM: ${{ vars.NORN_RELEASE_PUBLIC_KEY_PEM }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo "trusted release-tool checkout does not match the protected workflow SHA" >&2; exit 1; }
          [[ -n "$NORN_RELEASE_SIGNING_KEY" ]] || { echo "protected signing key is not configured" >&2; exit 1; }
          [[ -n "$NORN_RELEASE_PUBLIC_KEY_PEM" ]] || { echo "public verification key is not configured" >&2; exit 1; }
          umask 077
          public_key="$RUNNER_TEMP/norn-release-public.pem"
          printf '%s' "$NORN_RELEASE_PUBLIC_KEY_PEM" >"$public_key"
          publish_assets="$RUNNER_TEMP/release-assets"
          mkdir "$publish_assets"
          for bundle in release-bundles/platform-*
          do
            v2/scripts/platform-release-artifact sign --bundle-dir "$bundle"
            v2/scripts/platform-release-artifact verify --bundle-dir "$bundle" --public-key "$public_key" --quiet
            for asset in "$bundle"/*
            do
              destination="$publish_assets/$(basename "$asset")"
              [[ ! -e "$destination" ]] || { echo "duplicate release asset: $destination" >&2; exit 1; }
              cp "$asset" "$destination"
            done
          done
          expected_assets=16
          [[ "$(find "$publish_assets" -type f | wc -l | tr -d ' ')" == "$expected_assets" ]] || {
            echo "expected exactly $expected_assets release assets" >&2
            exit 1
          }

          tag="platform-$REQUESTED_SHA"
          # A retry may resume only an unpublished draft for this exact tag and
          # target. Every retained asset is downloaded and compared byte for
          # byte; mismatches and extras fail closed, and only missing names are
          # uploaded. Published releases and standalone tags are never reused.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          then
            [[ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == "true" ]] || {
              echo "refusing to overwrite an existing published release: $tag" >&2
              exit 1
            }
            [[ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)" == "$REQUESTED_SHA" ]] || {
              echo "existing draft targets a different commit" >&2
              exit 1
            }
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1
            then
              echo "refusing to reuse a standalone tag: $tag" >&2
              exit 1
            fi
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$REQUESTED_SHA" \
              --title "Norn platform $REQUESTED_SHA" \
              --notes "Immutable, Ed25519-signed Norn platform bundles for $REQUESTED_SHA." \
              --draft
          fi
          trap 'echo "Publish failed; the incomplete draft is retained for a verified resume on the next exact-SHA run." >&2' ERR

          remote_existing="$RUNNER_TEMP/remote-existing"
          mkdir "$remote_existing"
          declare -A expected_by_name=()
          for asset in "$publish_assets"/*
          do
            expected_by_name["$(basename "$asset")"]="$asset"
          done
          mapfile -t existing_names < <(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for name in "${existing_names[@]}"
          do
            [[ -n "${expected_by_name[$name]+present}" ]] || {
              echo "existing draft contains an unexpected asset: $name" >&2
              exit 1
            }
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$remote_existing"
            cmp -s "${expected_by_name[$name]}" "$remote_existing/$name" || {
              echo "existing draft asset differs from the signed local asset: $name" >&2
              exit 1
            }
          done

          missing_assets=()
          for name in "${!expected_by_name[@]}"
          do
            [[ -e "$remote_existing/$name" ]] || missing_assets+=("${expected_by_name[$name]}")
          done
          if [[ "${#missing_assets[@]}" -gt 0 ]]
          then
            gh release upload "$tag" "${missing_assets[@]}" --repo "$GITHUB_REPOSITORY"
          fi

          remote_complete="$RUNNER_TEMP/remote-complete"
          mkdir "$remote_complete"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$remote_complete"
          [[ "$(find "$remote_complete" -type f | wc -l | tr -d ' ')" == "$expected_assets" ]] || {
            echo "remote draft asset count is incomplete; leaving the draft unpublished" >&2
            exit 1
          }
          for name in "${!expected_by_name[@]}"
          do
            cmp -s "${expected_by_name[$name]}" "$remote_complete/$name" || {
              echo "remote draft asset verification failed: $name" >&2
              exit 1
            }
          done
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          [[ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq .isImmutable)" == "true" ]] || {
            echo "published release did not become immutable" >&2
            exit 1
          }
          trap - ERR
