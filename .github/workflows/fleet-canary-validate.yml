name: Fleet canary

on:
  pull_request:
    paths:
      - v2/infra/fleet-staging/canary/**
      - v2/scripts/publish-work-staging-canary-catalog
      - v2/scripts/test_publish_work_staging_canary_catalog.py
      - .github/workflows/fleet-canary-validate.yml
      - .github/workflows/fleet-canary-release.yml
  push:
    branches: [master]
    paths:
      - v2/infra/fleet-staging/canary/**
      - v2/scripts/publish-work-staging-canary-catalog
      - v2/scripts/test_publish_work_staging_canary_catalog.py
      - .github/workflows/fleet-canary-validate.yml
      - .github/workflows/fleet-canary-release.yml

permissions:
  contents: read

jobs:
  validate:
    name: Fleet canary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          cache-dependency-path: |
            v2/infra/fleet-staging/canary/go.mod
            v2/api/go.sum
      - name: Exercise placement and health response contract
        run: cd v2/infra/fleet-staging/canary && go test ./...
      - name: Validate the disabled staging InfraSpec
        run: cd v2/api && go run ./cmd/catalog-publisher-validate ../infra/fleet-staging/canary/infraspec.yaml
      - name: Prove publisher refuses cross-app and placeholder changes
        run: python3 v2/scripts/test_publish_work_staging_canary_catalog.py
