name: Fleet canary release

on:
  push:
    branches: [master]
    paths:
      - v2/infra/fleet-staging/canary/**
      - .github/workflows/fleet-canary-release.yml

permissions: {}

jobs:
  staging:
    # Source may merge while the runtime is being bootstrapped. A later
    # reviewed source commit triggers this caller after the owner enables it.
    # The staging OIDC audience and public keyless trust policy are pinned on
    # the Fleet controls before this protected push reaches the private runner.
    # The Fleet canary validation check must cover this same source commit.
    if: github.ref_protected && vars.NORN_FLEET_CANARY_STAGING_RELEASE_ENABLED == 'true'
    permissions:
      actions: read
      checks: read
      contents: read
      deployments: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: antiartificial/norn/.github/workflows/norn-app-release.yml@9a3abfe9dd026b269750f72407f056a78367343e
    with:
      lane: staging
      runner_private: true
      app_id: norn-fleet-canary
      image_repository: ghcr.io/antiartificial/norn-fleet-canary
      dockerfile: v2/infra/fleet-staging/canary/Dockerfile
      build_context: v2/infra/fleet-staging/canary
      build_contract: pilot-go
      go_image: golang@sha256:484ef6066fa69acb059fdfeda7ba2b8f7391f2ef6abc6f9b8411e669ebd56466
      runtime_image: gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
      required_checks: |
        Fleet canary	15368
