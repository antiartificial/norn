name: Repository CI

on:
  pull_request:
  push:
    branches: [master]

# Pull requests only need to read the repository. Keep token permissions narrow
# even when this workflow is evaluated for a trusted branch push.
permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API Go tests
    # The control plane includes Apple Container coverage that is meaningful
    # only on macOS; keep this gate on GitHub's current GA macOS image.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: v2/api/go.sum
      - name: Run API tests
        working-directory: v2/api
        run: go test ./...

  cli:
    name: CLI Go tests
    # Host-runtime security initialization is exercised on its target OS.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: v2/cli/go.sum
      - name: Run CLI tests
        working-directory: v2/cli
        run: go test ./...

  fleet-pilot:
    name: Fleet pilot workload
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: |
            v2/api/go.sum
            v2/infra/fleet-pilot/hello-norn-mysql/go.sum
      - name: Verify pilot Go workload
        working-directory: v2/infra/fleet-pilot/hello-norn-mysql
        run: |
          go test ./... -count=1
          go vet ./...
          go mod verify
      - name: Run pilot exercise tests
        working-directory: v2/infra/fleet-pilot
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest test_exercise.py -v
      - name: Install pinned etcdctl
        env:
          ETCD_ARCHIVE_SHA256: eff6ac621d41711085d0f38fab17d8fa3705f6326c3ff11301a1f5a71fc94edd
          ETCD_VERSION: 3.5.17
        run: |
          set -euo pipefail
          archive="etcd-v${ETCD_VERSION}-linux-amd64.tar.gz"
          url="https://github.com/etcd-io/etcd/releases/download/v${ETCD_VERSION}/${archive}"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$archive" "$url"
          printf '%s  %s\n' "$ETCD_ARCHIVE_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" \
            --directory "$RUNNER_TEMP" "etcd-v${ETCD_VERSION}-linux-amd64/etcdctl"
          tool_dir="$RUNNER_TEMP/etcd-tools"
          mkdir -p "$tool_dir"
          install -m 0755 "$RUNNER_TEMP/etcd-v${ETCD_VERSION}-linux-amd64/etcdctl" "$tool_dir/etcdctl"
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Qualify three-member Fleet control store
        env:
          NORN_ETCD_IMAGE: quay.io/coreos/etcd@sha256:a055da833a7c013b836ed0822e8ec1f99b059658be255ad8d0fcd31b635ae3d6
        timeout-minutes: 10
        run: |
          docker pull "$NORN_ETCD_IMAGE"
          bash v2/scripts/test-etcd-three-member-fleet

  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: v2/api/go.sum
      # This test parses the OpenAPI YAML and resolves every local reference.
      - name: Parse and validate the OpenAPI contract
        working-directory: v2/api
        run: go test ./contract

  web:
    name: Web UI tests and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: v2/ui/pnpm-lock.yaml
      - name: Install Web UI dependencies
        working-directory: v2/ui
        run: pnpm install --frozen-lockfile
      - name: Run Web UI tests
        working-directory: v2/ui
        run: pnpm test
      - name: Build Web UI
        working-directory: v2/ui
        run: pnpm build

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
      - name: Lint GitHub Actions workflows
        run: GOWORK=off go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - name: Lint M8 release evidence boundaries
        run: python3 v2/scripts/lint-m8-release-evidence.py
