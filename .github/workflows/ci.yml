name: Repository CI

on:
  pull_request:
  push:
    branches: [master]

# Pull requests only need to read the repository. Keep token permissions narrow
# even when this workflow is evaluated for a trusted branch push.
permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-qualification:
    name: Platform release qualification gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest v2/scripts/test_platform_release_qualification.py -v

  app-catalog-publisher:
    name: App catalog publisher contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: v2/scripts/test_publish_work_staging_app_catalog.sh

  api:
    name: API Go tests
    # The control plane includes Apple Container coverage that is meaningful
    # only on macOS; keep this gate on GitHub's current GA macOS image.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          cache-dependency-path: v2/api/go.sum
      - name: Run API tests
        working-directory: v2/api
        run: go test ./...

  cli:
    name: CLI Go tests
    # Host-runtime security initialization is exercised on its target OS.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          cache-dependency-path: v2/cli/go.sum
      - name: Run CLI tests
        working-directory: v2/cli
        run: go test ./...

  fleet-pilot:
    name: Fleet pilot workload
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          cache-dependency-path: |
            v2/api/go.sum
            v2/infra/fleet-pilot/hello-norn-mysql/go.sum
      - name: Verify pilot Go workload
        working-directory: v2/infra/fleet-pilot/hello-norn-mysql
        run: |
          go test ./... -count=1
          go vet ./...
          go mod verify
      - name: Run pilot exercise tests
        working-directory: v2/infra/fleet-pilot
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest test_exercise.py -v
      - name: Prepare pinned etcdctl
        env:
          ETCD_VERSION: 3.5.17
          NORN_ETCD_IMAGE: quay.io/coreos/etcd@sha256:a055da833a7c013b836ed0822e8ec1f99b059658be255ad8d0fcd31b635ae3d6
        run: |
          set -euo pipefail
          docker pull "$NORN_ETCD_IMAGE"
          version_output="$(docker run --rm --network none "$NORN_ETCD_IMAGE" /usr/local/bin/etcdctl version)"
          printf '%s\n' "$version_output" | grep -Fx "etcdctl version: $ETCD_VERSION" >/dev/null
          tool_dir="$RUNNER_TEMP/etcd-tools"
          mkdir -p "$tool_dir"
          cat > "$tool_dir/etcdctl" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${NORN_ETCD_IMAGE:?pinned etcd image is required}"
          : "${RUNNER_TEMP:?runner temp directory is required}"
          env_args=()
          for name in ETCDCTL_API ETCDCTL_ENDPOINTS ETCDCTL_CACERT ETCDCTL_CERT ETCDCTL_KEY ETCDCTL_USER ETCDCTL_PASSWORD; do
            if printenv "$name" >/dev/null 2>&1; then env_args+=(--env "$name"); fi
          done
          exec docker run --rm --network host --volume "$RUNNER_TEMP:$RUNNER_TEMP" \
            "${env_args[@]}" "$NORN_ETCD_IMAGE" /usr/local/bin/etcdctl "$@"
          EOF
          chmod 0755 "$tool_dir/etcdctl"
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Qualify three-member Fleet control store
        env:
          NORN_ETCD_IMAGE: quay.io/coreos/etcd@sha256:a055da833a7c013b836ed0822e8ec1f99b059658be255ad8d0fcd31b635ae3d6
          TMPDIR: ${{ runner.temp }}
        timeout-minutes: 10
        run: |
          bash v2/scripts/test-etcd-three-member-fleet

  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          cache-dependency-path: v2/api/go.sum
      # This test parses the OpenAPI YAML and resolves every local reference.
      - name: Parse and validate the OpenAPI contract
        working-directory: v2/api
        run: go test ./contract

  web:
    name: Web UI tests and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: v2/ui/pnpm-lock.yaml
      - name: Install Web UI dependencies
        working-directory: v2/ui
        run: pnpm install --frozen-lockfile
      - name: Run Web UI tests
        working-directory: v2/ui
        run: pnpm test
      - name: Build Web UI
        working-directory: v2/ui
        run: pnpm build

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
      - name: Lint GitHub Actions workflows
        run: GOWORK=off go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
