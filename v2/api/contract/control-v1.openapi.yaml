    Capabilities:
      type: object
      required: [protocolVersion, serverVersion, features, auth, endpoints]
      properties:
        protocolVersion: { type: integer }
        serverVersion: { type: string }
        features: { type: array, items: { type: string } }
        auth:
          type: object
          required: [scopes, websocketBearerHeader, websocketQueryToken]
          properties:
            scopes: { type: array, items: { type: string } }
            principal:
              type: object
              required: [authenticated, scopes]
              properties:
                authenticated: { type: boolean }
                subject: { type: string }
                deviceId: { type: string }
                scopes: { type: array, items: { type: string } }
                expiresAt: { type: string, format: date-time }
                legacy: { type: boolean }
            websocketBearerHeader: { type: boolean }
            websocketQueryToken: { type: boolean }
            deviceEnrollment: { type: boolean }
            stepUp:
              type: object
              properties:
                purposes: { type: array, items: { type: string } }
                algorithm: { const: ES256 }
                publicKeyFormat: { const: P-256-X9.63 }
                challengeTTLSeconds: { type: integer }
                header: { const: X-Norn-Step-Up }
            tokens:
              type: object
              properties:
                deviceTTLSeconds: { type: integer }
                rotation: { const: atomic }
                revocation: { const: registry }
        endpoints: { type: object, additionalProperties: { type: string } }
    HostMetrics:
      type: object
      required: [schemaVersion, observedAt, stale, samplePeriodSeconds, cpu, memory]
      properties:
        schemaVersion: { const: norn.host-metrics/v1 }
        observedAt: { type: string, format: date-time }
        stale: { type: boolean, description: True when refresh failed and the last successful sample is returned. }
        samplePeriodSeconds: { type: integer, minimum: 1 }
        cpu:
          type: object
          required: [utilizationPercent, logicalCores]
          properties:
            utilizationPercent: { type: number, minimum: 0, maximum: 100, description: Machine-wide non-idle CPU percentage reported by macOS at collection. }
            logicalCores: { type: integer, minimum: 1 }
        memory:
          type: object
          required: [totalBytes, usedBytes, availableBytes]
          properties:
            totalBytes: { type: integer, format: uint64 }
            usedBytes: { type: integer, format: uint64 }
            availableBytes: { type: integer, format: uint64 }
    ProductionReadinessReport:
      type: object
      required: [schema, generatedAt, status, summary, checks]
      properties:
        schema: { const: norn.production-readiness/v1 }
        generatedAt: { type: string, format: date-time }
        status: { type: string, enum: [ready, blocked] }
        summary:
          $ref: '#/components/schemas/ProductionReadinessSummary'
        checks:
          type: array
          items: { $ref: '#/components/schemas/ProductionReadinessCheck' }
    ProductionReadinessSummary:
      type: object
      required: [passed, warnings, failed, total]
      properties:
        passed: { type: integer, minimum: 0 }
        warnings: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    ProductionReadinessCheck:
      type: object
      required: [id, category, status, title, detail]
      properties:
        id: { type: string }
        category: { type: string }
        status: { type: string, enum: [pass, warn, fail] }
        title: { type: string }
        detail: { type: string }
        remediation: { type: string }
        evidence: { type: object, additionalProperties: true }
    MutationAuditList:
      type: object
      required: [schema, events, count]
      properties:
        schema: { const: norn.mutation-audit/v1 }
        count: { type: integer, minimum: 0 }
        events: { type: array, items: { $ref: '#/components/schemas/MutationAuditEvent' } }
    MutationAuditEvent:
      type: object
      required: [id, principalSubject, method, path, status, outcome, startedAt, durationMs, integrity]
      properties:
        id: { type: string, format: uuid }
        requestId: { type: string }
        principalSubject: { type: string }
        tokenId: { type: string }
        deviceId: { type: string, format: uuid }
        keyId: { type: string, pattern: '^[a-f0-9]{16}$' }
        scopes: { type: array, items: { type: string } }
        method: { type: string }
        path: { type: string }
        clientIp: { type: string }
        userAgent: { type: string }
        status: { type: integer }
        outcome: { type: string, enum: [started, succeeded, rejected, failed, crashed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        durationMs: { type: integer, format: int64, minimum: 0 }
        integrity: { type: string, enum: [pending, unsigned, verified, invalid, acknowledged-invalid] }
        incident: { $ref: '#/components/schemas/MutationAuditIncident' }
    MutationAuditIncidentRequest:
      type: object
      required: [reasonCode, explanation]
      additionalProperties: false
      properties:
        reasonCode:
          type: string
          enum: [legacy_timestamp_precision, legacy_signing_compatibility, signing_key_loss, storage_corruption, other]
        explanation: { type: string, minLength: 12, maxLength: 1024 }
    MutationAuditIncident:
      type: object
      required: [id, auditEventId, reasonCode, explanation, acknowledgedBy, acknowledgedAt, integrity]
      properties:
        id: { type: string, format: uuid }
        auditEventId: { type: string, format: uuid }
        reasonCode:
          type: string
          enum: [legacy_timestamp_precision, legacy_signing_compatibility, signing_key_loss, storage_corruption, other]
        explanation: { type: string }
        acknowledgedBy: { type: string }
        acknowledgedAt: { type: string, format: date-time }
        keyId: { type: string, pattern: '^[a-f0-9]{16}$' }
        integrity: { type: string, enum: [unsigned, verified, invalid] }
    RecoveryDrillList:
      type: object
      required: [schema, requiredKinds, drills, count]
      properties:
        schema: { const: norn.recovery-drills/v1 }
        requiredKinds: { type: array, items: { $ref: '#/components/schemas/RecoveryDrillKind' } }
        drills: { type: array, items: { $ref: '#/components/schemas/RecoveryDrill' } }
        count: { type: integer, minimum: 0 }
    RecoveryDrillKind:
      type: string
      enum: [artifact.rollback, database.restore, node.failover, region.failover, control.restore]
    RecoveryDrill:
      type: object
      required: [id, kind, status, initiatedBy, startedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/RecoveryDrillKind' }
        target: { type: string, maxLength: 256 }
        status: { type: string, enum: [running, passed, failed] }
        initiatedBy: { type: string }
        evidence: { type: object, additionalProperties: { type: string, maxLength: 1024 }, maxProperties: 20 }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    RecoveryDrillStartRequest:
      type: object
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/RecoveryDrillKind' }
        target: { type: string, maxLength: 256 }
    RecoveryDrillCompleteRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [passed, failed] }
        evidence: { type: object, additionalProperties: { type: string, maxLength: 1024 }, maxProperties: 20 }
    EnrollmentStartRequest:
      type: object
      required: [deviceName]
      properties:
        deviceName: { type: string, maxLength: 120 }
        platform: { type: string, maxLength: 80 }
        model: { type: string, maxLength: 120 }
        appVersion: { type: string, maxLength: 80 }
        publicKey: { type: string, maxLength: 128, description: Base64url P-256 X9.63 public key used for proof-of-possession step-up. }
        requestedScopes: { type: array, items: { type: string } }
    EnrollmentStartResponse:
      type: object
      required: [id, userCode, verifier, expiresAt, verificationPath, pollPath]
      properties:
        id: { type: string, format: uuid }
        userCode: { type: string, pattern: '^[A-Z2-9]{4}-[A-Z2-9]{4}$' }
        verifier: { type: string }
        expiresAt: { type: string, format: date-time }
        verificationPath: { type: string }
        pollPath: { type: string }
    Enrollment:
      type: object
      required: [id, deviceName, requestedScopes, status, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        deviceName: { type: string }
        platform: { type: string }
        model: { type: string }
        appVersion: { type: string }
        requestedScopes: { type: array, items: { type: string } }
        approvedScopes: { type: array, items: { type: string } }
        status: { type: string, enum: [pending, approved, exchanged, expired, locked] }
        deviceId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time }
        exchangedAt: { type: string, format: date-time }
    AccessTokenMetadata:
      type: object
      required: [id, scopes, issuedAt, expiresAt]
      properties:
        id: { type: string }
        deviceId: { type: string, format: uuid }
        subject: { type: string }
        scopes: { type: array, items: { type: string } }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        rotatedFrom: { type: string }
    IssuedToken:
      type: object
      required: [token, tokenId, deviceId, scopes, expiresAt]
      properties:
        token: { type: string, writeOnly: true }
        tokenId: { type: string }
        deviceId: { type: string, format: uuid }
        scopes: { type: array, items: { type: string } }
        expiresAt: { type: string, format: date-time }
    Device:
      type: object
      required: [id, name, createdAt, tokens]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        platform: { type: string }
        model: { type: string }
        appVersion: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        tokens: { type: array, items: { $ref: '#/components/schemas/AccessTokenMetadata' } }
    StepUpChallenge:
      type: object
      required: [id, purpose, resource, nonce, signaturePayload, expiresAt]
      properties:
        id: { type: string, format: uuid }
        purpose: { const: exec }
        resource: { type: string }
        nonce: { type: string }
        signaturePayload: { type: string }
        expiresAt: { type: string, format: date-time }
    StepUpAuthorization:
      type: object
      required: [stepUpToken, purpose, resource, challengeId, expiresAt]
      properties:
        stepUpToken: { type: string, writeOnly: true }
        purpose: { const: exec }
        resource: { type: string }
        challengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
    ExecSessionRequest:
      type: object
      properties:
        allocationId: { type: string }
        process: { type: string }
        argv: { type: array, maxItems: 128, items: { type: string, maxLength: 8192 }, default: [/bin/sh] }
        terminal: { type: boolean, default: true }
        columns: { type: integer, minimum: 1, maximum: 1000, default: 80 }
        rows: { type: integer, minimum: 1, maximum: 1000, default: 24 }
    ExecSessionCreated:
      type: object
      required: [session, protocol, streamPath]
      properties:
        session: { $ref: '#/components/schemas/ExecSession' }
        protocol: { const: norn.exec/v1 }
        streamPath: { type: string }
    ExecSession:
      type: object
      required: [id, deviceId, tokenId, challengeId, appId, allocationId, task, commandDigest, terminal, columns, rows, status, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        tokenId: { type: string }
        challengeId: { type: string, format: uuid }
        appId: { type: string }
        allocationId: { type: string }
        task: { type: string }
        commandDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
        terminal: { type: boolean }
        columns: { type: integer }
        rows: { type: integer }
        status: { type: string, enum: [pending, running, completed, failed, canceled, expired] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        connectedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        exitCode: { type: integer }
        errorCode: { type: string }
        remoteAddress: { type: string }
        userAgent: { type: string }
    ExecInputFrame:
      type: object
      required: [frame, sequence, data]
      properties:
        frame: { const: input }
        sequence: { type: integer, format: int64, minimum: 1 }
        data: { type: string }
        encoding: { type: string, enum: [utf8, base64], default: utf8 }
    ExecResizeFrame:
      type: object
      required: [frame, sequence, columns, rows]
      properties:
        frame: { const: resize }
        sequence: { type: integer, format: int64, minimum: 1 }
        columns: { type: integer, minimum: 1 }
        rows: { type: integer, minimum: 1 }
    ExecCloseInputFrame:
      type: object
      required: [frame, sequence]
      properties:
        frame: { const: close-input }
        sequence: { type: integer, format: int64, minimum: 1 }
    ExecReadyFrame:
      type: object
      required: [frame, sequence, timestamp, protocol, terminal, columns, rows]
      properties:
        frame: { const: ready }
        sequence: { type: integer, format: int64 }
        timestamp: { type: string, format: date-time }
        protocol: { const: norn.exec/v1 }
        terminal: { type: boolean }
        columns: { type: integer }
        rows: { type: integer }
    ExecOutputFrame:
      type: object
      required: [frame, sequence, timestamp, data, encoding]
      properties:
        frame: { type: string, enum: [stdout, stderr] }
        sequence: { type: integer, format: int64 }
        timestamp: { type: string, format: date-time }
        data: { type: string }
        encoding: { type: string, enum: [utf8, base64] }
    ExecErrorFrame:
      type: object
      required: [frame, sequence, timestamp, code, detail]
      properties:
        frame: { const: error }
        sequence: { type: integer, format: int64 }
        timestamp: { type: string, format: date-time }
        code: { type: string }
        detail: { type: string }
    ExecExitFrame:
      type: object
      required: [frame, sequence, timestamp, exitCode, reason]
      properties:
        frame: { const: exit }
        sequence: { type: integer, format: int64 }
        timestamp: { type: string, format: date-time }
        exitCode: { type: integer }
        reason: { type: string, enum: [exited, transport-error, expired] }
    AppStatus:
      type: object
      required: [spec, healthy, allocations, allocationSummary]
      properties:
        spec:
          type: object
          required: [name, processes]
          properties:
            name: { type: string }
            deploy: { type: boolean, default: false }
            primaryRegion: { type: string }
            regions:
              type: object
              additionalProperties: { $ref: '#/components/schemas/RegionTarget' }
            placement:
              type: object
              additionalProperties: false
              required: [nodePool]
              properties:
                nodePool: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' }
                distinctHosts: { type: boolean, description: 'Hard group-level Nomad anti-affinity. A rollout needs replicas plus live canaries in eligible clients; two replicas plus one live canary requires three eligible clients.' }
            repo: { type: object, additionalProperties: true }
            processes: { type: object, additionalProperties: true }
            endpoints: { type: array, items: { type: object, additionalProperties: true } }
        nomadStatus: { type: string }
        healthy: { type: boolean }
        allocations: { type: array, items: { type: object, additionalProperties: true } }
        allocationSummary: { type: object, additionalProperties: true }
    CreateAppRequest:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' }
        kind: { type: string, enum: [endpoint, worker] }
        port: { type: integer, minimum: 1, maximum: 65535, default: 8080 }
    AppMutationReceipt:
      type: object
      required: [app, spec]
      properties:
        app: { type: string }
        created: { type: boolean }
        spec: { type: object, additionalProperties: true }
    DocumentValidationRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document: { type: string, maxLength: 65536 }
        fleetDocument: { type: string, maxLength: 65536, description: Optional norn.dev/fleet/v1 context for InfraSpec node-pool cross-validation. }
    ValidationFinding:
      type: object
      required: [severity, code, field, message]
      properties:
        severity: { type: string, enum: [error, warning, info] }
        code: { type: string }
        field: { type: string }
        message: { type: string }
        remediation: { type: string }
    InfraSpecValidationReport:
      type: object
      required: [schemaVersion, documentKind, valid, findings]
      properties:
        schemaVersion: { const: norn.validation-report/v1 }
        documentKind: { const: infraspec }
        app: { type: string }
        valid: { type: boolean }
        findings: { type: array, items: { $ref: '#/components/schemas/ValidationFinding' } }
    FleetValidationReport:
      type: object
      required: [schemaVersion, documentKind, valid, findings]
      properties:
        schemaVersion: { const: norn.validation-report/v1 }
        documentKind: { const: fleet }
        name: { type: string }
        valid: { type: boolean }
        findings: { type: array, items: { $ref: '#/components/schemas/ValidationFinding' } }
    FleetMetadata:
      type: object
      additionalProperties: false
      properties:
        repository: { type: string }
        environment: { type: string }
        workflowUrl: { type: string, format: uri }
    FleetCluster:
      type: object
      additionalProperties: false
      required: [name, provider, region]
      properties:
        name: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' }
        provider: { type: string }
        region: { type: string }
    FleetReplacementPolicy:
      type: object
      additionalProperties: false
      properties:
        strategy: { type: string, enum: [blueGreen, rolling], default: blueGreen }
        requireCapacityHeadroom: { type: boolean }
        drainTimeout: { type: string }
        requireReadiness: { type: boolean }
    FleetNodePool:
      type: object
      additionalProperties: false
      required: [size, min, desired, max]
      properties:
        size: { type: string }
        min: { type: integer, minimum: 0 }
        desired: { type: integer, minimum: 0 }
        max: { type: integer, minimum: 1 }
        labels: { type: object, additionalProperties: { type: string } }
        replacement: { $ref: '#/components/schemas/FleetReplacementPolicy' }
    FleetDocument:
      type: object
      additionalProperties: false
      required: [apiVersion, kind, cluster, nodePools]
      properties:
        apiVersion: { const: norn.dev/fleet/v1 }
        kind: { const: Cluster }
        metadata: { $ref: '#/components/schemas/FleetMetadata' }
        cluster: { $ref: '#/components/schemas/FleetCluster' }
        nodePools:
          type: object
          additionalProperties: { $ref: '#/components/schemas/FleetNodePool' }
    FleetInventory:
      type: object
      required: [schemaVersion, configured, nodePools]
      properties:
        schemaVersion: { const: norn.fleet-inventory/v1 }
        configured: { type: boolean }
        source: { type: string }
        digest: { type: string }
        document: { $ref: '#/components/schemas/FleetDocument' }
        validation: { $ref: '#/components/schemas/FleetValidationReport' }
        nodePools:
          type: object
          additionalProperties: { $ref: '#/components/schemas/FleetNodePool' }
    FleetGitHubStatus:
      type: object
      additionalProperties: false
      required: [schemaVersion, configured, connected]
      properties:
        schemaVersion: { const: norn.fleet-github-status/v1 }
        configured: { type: boolean }
        connected: { type: boolean }
        repository: { type: string }
        installationId: { type: integer, format: int64 }
        environment: { type: string, enum: [staging, production], description: Fixed non-secret Fleet GitHub dispatch lane. }
        pilotRunId: { type: string, pattern: '^[a-z0-9]{8,24}$', description: Exact disposable Fleet pilot run when configured. }
        defaultBranch: { type: string }
        configPath: { type: string }
        planWorkflow: { type: string }
        applyWorkflow: { type: string }
        message: { type: string }
    FleetGitHubDispatchRequest:
      type: object
      additionalProperties: false
      required: [allowDestructive]
      properties:
        allowDestructive: { type: boolean }
    FleetCapacityPlanRequest:
      type: object
      additionalProperties: false
      properties:
        desired: { type: integer, minimum: 0 }
        size: { type: string }
        strategy: { type: string, enum: [blueGreen, rolling] }
        reason: { type: string, maxLength: 1000 }
    FleetReconciliationRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, attemptId, phase, status, commitSha, planSha256, evidenceDigest]
      properties:
        schemaVersion: { const: norn.fleet-reconciliation/v1 }
        attemptId: { type: string, format: uuid, description: Required binding to one live durable runner attempt. }
        phase:
          type: string
          enum: [prechange_verified, provider_applying, infrastructure_applied, inventory_generated, nodes_configured, nodes_enrolled, readiness_verified, old_nodes_drained, complete]
        status: { type: string, enum: [succeeded, failed] }
        commitSha: { type: string, pattern: '^[0-9a-f]{40}$' }
        planSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        stateSerial: { type: integer, format: int64, minimum: 0 }
        evidenceDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        message: { type: string, maxLength: 1000 }
    FleetRunnerAttempt:
      type: object
      additionalProperties: false
      required: [schemaVersion, id, planId, attempt, rootAttemptId, sourceDispatchRunId, pilotRunId, status, currentPhase, commitSha, planSha256, heartbeatSequence, heartbeatTimeoutSeconds, revision, startedAt, heartbeatAt, heartbeatExpiresAt, updatedAt]
      properties:
        schemaVersion: { const: norn.fleet-runner-attempt/v1 }
        id: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        attempt: { type: integer, minimum: 1 }
        rootAttemptId: { type: string, format: uuid, readOnly: true }
        runnerAttemptId: { type: string, maxLength: 200 }
        # Pre-dispatch historical attempts are backfilled with 0 because no
        # source run existed when they were created. New starts require >0.
        sourceDispatchRunId: { type: integer, format: int64, minimum: 0, readOnly: true }
        # Empty for ordinary lanes. Disposable attempts carry the exact current
        # authority run and never become valid merely because staging matches.
        pilotRunId: { type: string, pattern: '^(|[a-z0-9]{8,24})$', readOnly: true }
        recovery: { type: boolean, readOnly: true }
        status: { type: string, enum: [queued, running, succeeded, failed, canceled, abandoned] }
        currentPhase:
          type: string
          enum: [prechange_verified, provider_applying, infrastructure_applied, inventory_generated, nodes_configured, nodes_enrolled, readiness_verified, old_nodes_drained, complete]
        commitSha: { type: string, pattern: '^[0-9a-f]{40}$' }
        planSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        workflowUrl: { type: string, format: uri }
        principalSubject: { type: string }
        retryOf: { type: string, format: uuid }
        heartbeatSequence: { type: integer, format: int64, minimum: 0 }
        heartbeatTimeoutSeconds: { type: integer, minimum: 30, maximum: 900 }
        revision: { type: integer, format: int64, minimum: 1 }
        startedAt: { type: string, format: date-time }
        phaseStartedAt: { type: string, format: date-time, readOnly: true, description: Server-owned start time for currentPhase; advances only after evidence-gated phase transition. }
        heartbeatAt: { type: string, format: date-time }
        heartbeatExpiresAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        lastError: { type: string }
        metadata: { type: object, additionalProperties: true }
        timing: { $ref: '#/components/schemas/FleetRunnerTiming' }
    FleetRunnerAttemptList:
      type: object
      required: [schemaVersion, planId, attempts, count, serverTime]
      properties:
        schemaVersion: { const: norn.fleet-runner-attempt/v1 }
        planId: { type: string, format: uuid }
        attempts: { type: array, items: { $ref: '#/components/schemas/FleetRunnerAttempt' } }
        count: { type: integer, minimum: 0 }
        serverTime: { type: string, format: date-time }
    FleetRunnerAttemptStartRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, runnerAttemptId, commitSha, planSha256, dispatchNonce, sourceDispatchRunId, pilotRunId]
      properties:
        schemaVersion: { const: norn.fleet-runner-attempt/v1 }
        runnerAttemptId: { type: string, minLength: 1, maxLength: 200 }
        commitSha: { type: string, pattern: '^[0-9a-f]{40}$' }
        planSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        dispatchNonce: { type: string, pattern: '^[0-9a-f]{64}$', writeOnly: true }
        sourceDispatchRunId: { type: integer, format: int64, minimum: 1 }
        pilotRunId: { type: string, pattern: '^(|[a-z0-9]{8,24})$', description: Exact disposable pilot run, or the required empty string for an ordinary lane. }
        resume: { type: boolean, default: false }
        workflowUrl: { type: string, format: uri }
        heartbeatTimeoutSeconds: { type: integer, minimum: 30, maximum: 900, default: 120 }
        operationClass: { type: string, enum: [cold_start, unknown], description: Optional protected-runner classification derived from the reviewed provider-plan summary. cold_start requires exactly five creates; unknown is a conservative abstention. }
        createdNodeCount: { type: integer, minimum: 0, maximum: 1000, description: Optional reviewed provider-plan count. cold_start accepts exactly 5; unknown accepts 0 through 1000. }
    FleetTimingRange:
      type: object
      additionalProperties: false
      required: [lowMs, highMs]
      properties:
        lowMs: { type: integer, format: int64, minimum: 0 }
        highMs: { type: integer, format: int64, minimum: 0 }
    FleetTimingCompletionRange:
      type: object
      additionalProperties: false
      required: [earliestAt, latestAt]
      properties:
        earliestAt: { type: string, format: date-time }
        latestAt: { type: string, format: date-time }
    FleetTimingProvenance:
      type: object
      additionalProperties: false
      required: [method, sampleCount, successfulSampleCount, exclusions]
      properties:
        method: { type: string, enum: [configured_range, unavailable] }
        configuredRange: { $ref: '#/components/schemas/FleetTimingRange' }
        sampleCount: { type: integer, minimum: 0 }
        successfulSampleCount: { type: integer, minimum: 0 }
        exclusions: { type: array, items: { type: string, enum: [review_approval, github_queue, dns_propagation, application_migrations] } }
    FleetTimingPhase:
      type: object
      additionalProperties: false
      required: [name, state, elapsedMs]
      properties:
        name: { type: string, enum: [prechange_verified, provider_applying, infrastructure_applied, inventory_generated, nodes_configured, nodes_enrolled, readiness_verified, old_nodes_drained, complete] }
        state: { type: string, enum: [active, complete, terminal] }
        elapsedMs: { type: integer, format: int64, minimum: 0 }
        estimatedRemaining: { $ref: '#/components/schemas/FleetTimingRange' }
    FleetRunnerTiming:
      type: object
      additionalProperties: false
      required: [schemaVersion, scope, asOf, availability, operationClass, elapsedMs, confidence, provenance, phases]
      properties:
        schemaVersion: { const: norn.fleet-timing/v1 }
        scope: { const: runner_attempt }
        asOf: { type: string, format: date-time }
        availability: { type: string, enum: [available, unavailable] }
        operationClass: { type: string, enum: [cold_start, unknown] }
        elapsedMs: { type: integer, format: int64, minimum: 0 }
        estimatedRemaining: { $ref: '#/components/schemas/FleetTimingRange' }
        estimatedTotal: { $ref: '#/components/schemas/FleetTimingRange' }
        estimatedCompletion: { $ref: '#/components/schemas/FleetTimingCompletionRange' }
        confidence: { type: string, enum: [low, none] }
        provenance: { $ref: '#/components/schemas/FleetTimingProvenance', description: Advisory provenance. Heartbeats prove liveness only; evidence-gated checkpoints prove phase completion. }
        phases: { type: array, minItems: 1, items: { $ref: '#/components/schemas/FleetTimingPhase' } }
    FleetRunnerHeartbeatRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, phase, sequence, revision]
      properties:
        schemaVersion: { const: norn.fleet-runner-attempt/v1 }
        phase: { type: string, enum: [prechange_verified, provider_applying, infrastructure_applied, inventory_generated, nodes_configured, nodes_enrolled, readiness_verified, old_nodes_drained, complete] }
        sequence: { type: integer, format: int64, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 1 }
        message: { type: string, maxLength: 500 }
    FleetRunnerAdvanceRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, expectedPhase, revision]
      properties:
        schemaVersion: { const: norn.fleet-runner-attempt/v1 }
        expectedPhase: { type: string, enum: [prechange_verified, provider_applying, infrastructure_applied, inventory_generated, nodes_configured, nodes_enrolled, readiness_verified, old_nodes_drained, complete] }
        revision: { type: integer, format: int64, minimum: 1 }
    FleetRunnerCancelRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, revision, reason]
      properties:
        schemaVersion: { const: norn.fleet-runner-attempt/v1 }
        revision: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    DeploymentRegion:
      type: object
      required: [region, nomadRegion, status, desiredWeight, activeWeight, updatedAt]
      properties:
        deploymentId: { type: string, format: uuid }
        region: { type: string }
        nomadRegion: { type: string }
        status: { type: string, enum: [queued, building, testing, migrating, submitting, healthy, deployed, failed] }
        desiredWeight: { type: integer, minimum: 0, maximum: 100 }
        activeWeight: { type: integer, minimum: 0, maximum: 100 }
        evalId: { type: string }
        lastError: { type: string }
        updatedAt: { type: string, format: date-time }
    Deployment:
      type: object
      required: [id, app, commitSha, imageTag, sagaId, status, startedAt]
      properties:
        id: { type: string, format: uuid }
        app: { type: string }
        commitSha: { type: string }
        imageTag: { type: string }
        sagaId: { type: string, format: uuid }
        status: { type: string, enum: [queued, building, testing, migrating, submitting, healthy, deployed, failed] }
        sourceKind: { type: string }
        sourceRef: { type: string }
        sourceDirty: { type: boolean }
        sourceChanges: { type: array, items: { type: string } }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        regions: { type: array, items: { $ref: '#/components/schemas/DeploymentRegion' } }
    DeploymentList:
      type: object
      required: [schemaVersion, deployments, count]
      properties:
        schemaVersion: { const: norn.deployments/v1 }
        deployments: { type: array, items: { $ref: '#/components/schemas/Deployment' } }
        count: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
    DeploymentStep:
      type: object
      required: [deploymentId, app, sagaId, step, status, startedAt]
      properties:
        deploymentId: { type: string, format: uuid }
        app: { type: string }
        sagaId: { type: string, format: uuid }
        step: { type: string }
        status: { type: string, enum: [running, complete, failed] }
        kind: { type: string, enum: [readonly, mutable] }
        attempt: { type: integer, minimum: 0 }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        durationMs: { type: integer, format: int64, minimum: 0 }
        message: { type: string }
        metadata: { type: object, additionalProperties: true }
    DeploymentStepList:
      type: object
      required: [schemaVersion, deploymentId, steps, count]
      properties:
        schemaVersion: { const: norn.deployment-steps/v1 }
        deploymentId: { type: string, format: uuid }
        steps: { type: array, items: { $ref: '#/components/schemas/DeploymentStep' } }
        count: { type: integer, minimum: 0 }
    ServiceInstance:
      type: object
      required: [placementVerified]
      properties:
        id: { type: string }
        allocationId: { type: string }
        node: { type: string }
        address: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        status: { type: string, enum: [passing, warning, critical] }
        region: { type: string }
        nodePool: { type: string }
        placementSource: { type: string, enum: [consul-tags, local-runtime, unverified] }
        placementVerified: { type: boolean }
    ServiceReachability:
      type: object
      required: [endpointScope, instanceScope, exposure, routable]
      properties:
        endpointScope: { type: string }
        instanceScope: { type: string }
        exposure: { type: string }
        routable: { type: boolean }
    ServiceManifestEntry:
      type: object
      required: [name, app, process, type, status, reachability]
      properties:
        name: { type: string }
        app: { type: string }
        process: { type: string }
        type: { type: string, enum: [service, worker, cron, function] }
        status: { type: string }
        healthPath: { type: string }
        reachability: { $ref: '#/components/schemas/ServiceReachability' }
        endpoints: { type: array, items: { type: object, additionalProperties: true } }
        instances: { type: array, items: { $ref: '#/components/schemas/ServiceInstance' } }
        metrics: { type: object, additionalProperties: true }
        metadata: { type: object, additionalProperties: { type: string } }
    ServiceManifest:
      type: object
      required: [version, generatedAt, contract, services]
      properties:
        version: { const: 2 }
        generatedAt: { type: string, format: date-time }
        networkMode: { type: string }
        contract:
          type: object
          required: [schema, processTypes, reachabilityScopes]
          properties:
            schema: { const: norn.service-manifest.v2 }
            processTypes: { type: array, items: { type: string } }
            reachabilityScopes: { type: array, items: { type: string } }
        services: { type: array, items: { $ref: '#/components/schemas/ServiceManifestEntry' } }
    RegionTarget:
      type: object
      properties:
        nomadRegion: { type: string }
        datacenters: { type: array, items: { type: string } }
        trafficWeight: { type: integer, minimum: 0, maximum: 100, default: 100 }
    Release:
      type: object
      required: [sha, version, createdAt, path, current]
      properties:
        sha:
          type: string
          pattern: '^[0-9a-f]{40}$'
          description: Exact immutable source commit and artifact lookup identity.
        version:
          type: string
          description: Immutable version embedded in the retained release manifest.
        displayVersion:
          type: string
          description: Optional version-first human label; clients should prefer it while using sha for mutations and artifact lookup.
        createdAt: { type: string, format: date-time }
        path: { type: string }
        current: { type: boolean }
    ReleaseList:
      type: object
      required: [releases]
      properties:
        current: { type: string }
        releases: { type: array, items: { $ref: '#/components/schemas/Release' } }
    HostStatus:
      type: object
      required: [schemaVersion, status, services, observedAt]
      properties:
        schemaVersion: { const: norn.host-status/v1 }
        status: { type: string, enum: [ok, degraded] }
        services: { type: object, additionalProperties: { type: string } }
        latestAssurance: { $ref: '#/components/schemas/Operation' }
        observedAt: { type: string, format: date-time }
    ContainerRuntime:
      type: object
      required: [backend, available, taskDriver, buildCmd]
      properties:
        backend: { type: string, enum: [docker, container] }
        version: { type: string }
        available: { type: boolean }
        taskDriver: { type: string }
        buildCmd: { type: string }
        capabilities: { type: array, items: { type: string } }
    RuntimeBackend:
      type: object
      required: [name, available, current]
      properties:
        name: { type: string }
        available: { type: boolean }
        current: { type: boolean }
    WorkloadConnector:
      type: object
      required: [name, scheduler, discovery, runtime, available, productionReady, localOnly, capabilities]
      properties:
        name: { type: string, enum: [nomad-consul, apple-container] }
        scheduler: { type: string }
        discovery: { type: string }
        runtime: { type: string }
        available: { type: boolean }
        productionReady: { type: boolean }
        localOnly: { type: boolean }
        capabilities: { type: array, items: { type: string } }
        limitations: { type: array, items: { type: string } }
    HostRuntime:
      type: object
      required: [active, backends, connector, connectors]
      properties:
        active: { $ref: '#/components/schemas/ContainerRuntime' }
        backends: { type: array, items: { $ref: '#/components/schemas/RuntimeBackend' } }
        connector: { $ref: '#/components/schemas/WorkloadConnector' }
        connectors: { type: array, items: { $ref: '#/components/schemas/WorkloadConnector' } }
    EventBounds:
      type: object
      required: [oldestCursor, latestCursor, retainedEvents]
      properties:
        oldestCursor: { type: integer, format: int64 }
        latestCursor: { type: integer, format: int64 }
        retainedEvents: { type: integer, format: int64 }
        oldestTimestamp: { type: string, format: date-time }
        latestTimestamp: { type: string, format: date-time }
    EventStreamInfo:
      type: object
      required: [protocolVersion, bounds, retentionPolicy, retention, gapDetection, heartbeatMinimumSeconds, heartbeatMaximumSeconds, filters]
      properties:
        protocolVersion: { type: integer }
        bounds: { $ref: '#/components/schemas/EventBounds' }
        retentionPolicy: { type: string }
        retention:
          type: object
          required: [mode, automaticPruning, replayPageSize]
          properties:
            mode: { type: string, enum: [unbounded] }
            automaticPruning: { type: boolean }
            replayPageSize: { type: integer }
        gapDetection: { type: boolean }
        heartbeatMinimumSeconds: { type: integer }
        heartbeatMaximumSeconds: { type: integer }
        filters: { type: array, items: { type: string } }
    Event:
      type: object
      required: [id, timestamp, type, payload]
      properties:
        id: { type: integer, format: int64 }
        timestamp: { type: string, format: date-time }
        type: { type: string }
        appId: { type: string }
        payload: {}
    HeartbeatFrame:
      type: object
      required: [frame, timestamp]
      properties:
        frame: { const: heartbeat }
        timestamp: { type: string, format: date-time }
    Operation:
      type: object
      required: [id, kind, status, startedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        app: { type: string }
        sagaId: { type: string }
        ref: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, canceled] }
        risk: { type: string }
        source: { type: string }
        message: { type: string }
        payload: { type: object, additionalProperties: true }
        metadata: { type: object, additionalProperties: true }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        lockedBy: { type: string }
        lockedUntil: { type: string, format: date-time }
        nextAttemptAt: { type: string, format: date-time }
        lastError: { type: string }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        receipt: { $ref: '#/components/schemas/OperationReceipt' }
    OperationReceipt:
      type: object
      required: [schemaVersion, kind, outcome, summary, startedAt]
      properties:
        schemaVersion: { const: norn.operation-receipt/v1 }
        kind: { type: string }
        outcome: { type: string, enum: [succeeded, failed, canceled] }
        summary: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        platform: { $ref: '#/components/schemas/PlatformOperationReceipt' }
        host: { $ref: '#/components/schemas/HostAssuranceReceipt' }
        app: { $ref: '#/components/schemas/AppOperationReceipt' }
        fleet: { $ref: '#/components/schemas/FleetOperationReceipt' }
    PlatformOperationReceipt:
      type: object
      properties:
        ref: { type: string }
        sha: { type: string }
        mode: { type: string, enum: [restart, proxy] }
        drainMode: { type: string, enum: [fail, wait, force] }
        exitCode: { type: integer }
        output: { type: string }
        outputTruncated: { type: boolean }
    HostAssuranceReceipt:
      type: object
      properties:
        exitCode: { type: integer }
        output: { type: string }
        outputTruncated: { type: boolean }
    AppOperationReceipt:
      type: object
      required: [app]
      properties:
        app: { type: string }
        ref: { type: string }
        deploymentId: { type: string }
        commitSha: { type: string }
        imageTag: { type: string }
        step: { type: string }
        snapshot: { type: string }
        preRestoreSnapshot: { type: string }
        database: { type: string }
        keep: { type: integer }
        pruned: { type: array, items: { type: string } }
    AppSnapshot:
      type: object
      required: [filename, database, timestamp, size]
      properties:
        filename: { type: string }
        database: { type: string }
        commitSha: { type: string }
        timestamp: { type: string, pattern: '^[0-9]{8}T[0-9]{6}$' }
        createdAt: { type: string, format: date-time }
        size: { type: integer, format: int64, minimum: 0 }
    FleetOperationReceipt:
      type: object
      required: [planId]
      properties:
        planId: { type: string, format: uuid }
        cluster: { type: string }
        pool: { type: string }
        action: { type: string, enum: [scale, replace, reconcile] }
        sourceDigest: { type: string }
        planDigest: { type: string }
        signature: { type: string }
        workflowUrl: { type: string, format: uri }
        phase: { type: string }
        commitSha: { type: string }
        planSha256: { type: string }
        stateSerial: { type: integer, format: int64 }
        evidenceDigest: { type: string }
    PlatformRefRequest:
      type: object
      properties: { ref: { type: string, default: HEAD } }
    PlatformUpgradeRequest:
      type: object
      required: [ref]
      properties:
        ref: { type: string }
        mode: { type: string, enum: [restart, proxy], default: restart }
        drainMode: { type: string, enum: [fail, wait, force], default: fail }
    ExternalFleetAdmissionBeginRequest:
      type: object
      additionalProperties: false
      required: [logicalIdentity]
      properties:
        logicalIdentity: { $ref: '#/components/schemas/ExternalFleetLogicalIdentity' }
    ExternalFleetLogicalIdentity:
      type: object
      additionalProperties: false
      required: [schemaVersion, sourceSha, artifact, candidate, fleet]
      properties:
        schemaVersion: { const: norn.external-fleet-logical-identity/v4 }
        sourceSha: { type: string, pattern: '^[0-9a-f]{40}$' }
        artifact: { type: string, pattern: '^.+@sha256:[0-9a-f]{64}$' }
        candidate: { $ref: '#/components/schemas/ReleaseCandidate' }
        fleet: { $ref: '#/components/schemas/ExternalFleetLogicalExecutionIdentity' }
    ExternalFleetLogicalExecutionIdentity:
      type: object
      additionalProperties: false
      required: [namespace, planId, planSha256, rootAttemptId, fleetCommit]
      properties:
        namespace: { type: string }
        planId: { type: string }
        planSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        rootAttemptId: { type: string }
        fleetCommit: { type: string, pattern: '^[0-9a-f]{40}$' }
    ExternalFleetAdmissionNonceResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, admissionId, state, nonce, expiresAt, nonceGeneration]
      properties:
        schemaVersion: { const: norn.external-fleet-admission/v4 }
        admissionId: { type: string, format: uuid, readOnly: true }
        state: { const: nonce_ready, readOnly: true }
        nonce: { type: string, minLength: 101, maxLength: 101, description: Raw short-lived one-use nonce. It is returned exactly once after hash-only registration is durable; clients must not log, persist, or echo it outside the v4 receipt nonce field., x-sensitive: true }
        expiresAt: { type: string, format: date-time, readOnly: true }
        nonceGeneration: { type: integer, format: int64, minimum: 1, readOnly: true }
    ExternalFleetAdmissionReplayResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, admissionId, state, nonceGeneration, operationId]
      properties:
        schemaVersion: { const: norn.external-fleet-admission/v4 }
        admissionId: { type: string, format: uuid, readOnly: true }
        state: { type: string, enum: [committed, cleanup_pending, complete], readOnly: true }
        nonceGeneration: { type: integer, format: int64, minimum: 1, readOnly: true }
        operationId: { type: string, format: uuid, readOnly: true }
        cleanupState: { type: string, enum: [pending, complete], readOnly: true }
    ExternalFleetAdmissionResumeRequest:
      type: object
      additionalProperties: false
      required: [admissionId, logicalIdentity]
      properties:
        admissionId: { type: string, format: uuid }
        logicalIdentity: { $ref: '#/components/schemas/ExternalFleetLogicalIdentity' }
    ExternalFleetDeploymentAdmissionRequest:
      type: object
      additionalProperties: false
      oneOf:
        - required: [receipt]
        - required: [admissionId]
      properties:
        admissionId: { type: string, format: uuid, description: Receipt-free terminal replay selector. Requires the original Idempotency-Key and exact authenticated app/repository/environment binding. }
        receipt: { $ref: '#/components/schemas/ExternalFleetDeploymentReceiptV4' }
    ExternalFleetAdmissionCleanupRequest:
      type: object
      additionalProperties: false
      required: [admissionId, operationId, receiptDigest, cleanupIntentDigest, absenceProofDigest]
      properties:
        admissionId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        receiptDigest: { type: string, pattern: '^[0-9a-f]{64}$', description: Server-canonical SHA-256 digest of the admitted receipt. }
        cleanupIntentDigest: { type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 digest of the evidence-service cleanup intent bound to this terminal admission. }
        absenceProofDigest: { type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 digest of the evidence-service proof that the registered nonce material is absent. }
    ExternalFleetAdmissionReconcileRequest:
      type: object
      additionalProperties: false
      required: [admissionId]
      properties:
        admissionId: { type: string, format: uuid }
    ExternalFleetDeploymentReceiptV4:
      type: object
      additionalProperties: false
      required: [schemaVersion, admissionId, nonce, app, sourceSha, artifact, candidate, attestationBundleSha256, sbomBundleSha256, fleet, chronology]
      properties:
        schemaVersion: { const: norn.external-fleet-deployment-receipt/v4 }
        admissionId: { type: string, format: uuid }
        nonce: { type: string, writeOnly: true }
        app: { type: string }
        sourceSha: { type: string, pattern: '^[0-9a-f]{40}$' }
        artifact: { type: string, pattern: '^.+@sha256:[0-9a-f]{64}$' }
        candidate: { $ref: '#/components/schemas/ReleaseCandidate' }
        attestationBundleSha256: { type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of the full canonical Sigstore provenance bundle JSON under the Norn v4 profile. }
        sbomBundleSha256: { type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of the full canonical Sigstore SPDX bundle JSON under the Norn v4 profile. }
        fleet: { $ref: '#/components/schemas/ExternalFleetExecutionProofV4' }
        chronology:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: '#/components/schemas/ExternalFleetChronologyStep' }
    ExternalFleetExecutionProofV4:
      type: object
      additionalProperties: false
      required: [namespace, migration, runtime, planId, applyRunId, applyRunAttempt, planSha256, runnerAttemptId, rootAttemptId, fleetCommit, nonceEvidenceRef]
      properties:
        namespace: { type: string }
        migration: { $ref: '#/components/schemas/ExternalFleetNomadJobProofV4' }
        runtime: { $ref: '#/components/schemas/ExternalFleetNomadJobProofV4' }
        planId: { type: string }
        applyRunId: { type: string }
        applyRunAttempt: { type: string }
        planSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        runnerAttemptId: { type: string }
        rootAttemptId: { type: string }
        fleetCommit: { type: string, pattern: '^[0-9a-f]{40}$' }
        nonceEvidenceRef: { type: string }
    ExternalFleetNomadJobProofV4:
      type: object
      additionalProperties: false
      required: [jobId, hclSha256, evalId, evalCreateIndex, evalJobModifyIndex, jobCreateIndex, jobModifyIndex, jobVersion, currentSpec, currentSpecSha256, submission, submissionSha256, evaluationChainIds, checkpointId]
      properties:
        jobId: { type: string }
        hclSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        evalId: { type: string, format: uuid, description: Nomad v2 JobRegisterResponse EvalID. }
        evalCreateIndex: { type: integer, format: int64, minimum: 1 }
        evalJobModifyIndex: { type: integer, format: int64, minimum: 1 }
        jobCreateIndex: { type: integer, format: int64, minimum: 1 }
        jobModifyIndex: { type: integer, format: int64, minimum: 1 }
        jobVersion: { type: integer, format: int64, minimum: 0 }
        currentSpec:
          type: object
          additionalProperties: true
          description: Exact Nomad job-inspect JSON. Norn verifies ID/namespace/create index/modify index/version, removes only Status, StatusDescription, Stable, ModifyIndex, CreateIndex, Version, JobModifyIndex, and SubmitTime at the root, then hashes sorted compact UTF-8 JSON without HTML escaping under norn.nomad-v4-canonical-json/v1.
        currentSpecSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        submission:
          type: object
          additionalProperties: true
          description: Exact versioned Nomad JobSubmission JSON. Norn requires root JobID, Namespace, Version, JobModifyIndex (or JobIndex), Source, Variables, VariableFlags, and Format, then hashes the complete sorted compact UTF-8 JSON under norn.nomad-v4-canonical-json/v1.
        submissionSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        evaluationChainIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        checkpointId: { type: string }
    ExternalFleetAdmissionContext:
      type: object
      additionalProperties: false
      required: [schemaVersion, admissionId, state, logicalIdentity, logicalDigest, nonceGeneration, cleanupState, retryLineage, checkpoints]
      properties:
        schemaVersion: { const: norn.external-fleet-admission-context/v4 }
        admissionId: { type: string, format: uuid, readOnly: true }
        state: { type: string, enum: [initiated, nonce_registering, nonce_ready, evidence_claimed, committed, cleanup_pending, complete, expired], readOnly: true }
        logicalIdentity: { $ref: '#/components/schemas/ExternalFleetLogicalIdentity', readOnly: true }
        logicalDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$', readOnly: true }
        nonceGeneration: { type: integer, format: int64, minimum: 0, readOnly: true }
        operationId: { type: string, format: uuid, readOnly: true }
        cleanupState: { type: string, enum: [not_required, pending, complete], readOnly: true }
        retryLineage:
          type: array
          readOnly: true
          items: { type: string, format: uuid }
        checkpoints:
          type: array
          readOnly: true
          items:
            type: object
            additionalProperties: false
            required: [phase, checkpointId, attemptId, evidenceRef, evidenceSha256]
            properties:
              phase: { type: string }
              checkpointId: { type: string }
              attemptId: { type: string }
              evidenceRef: { type: string }
              evidenceSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    ExternalFleetChronologyStep:
      type: object
      additionalProperties: false
      required: [phase, occurredAt, evidenceRef]
      properties:
        phase: { type: string, enum: [prepare, migration, runtime, exercise] }
        occurredAt: { type: string, format: date-time }
        evidenceRef: { type: string, format: uri }
    ReleaseRequest:
      type: object
      additionalProperties: false
      required: [sourceSha, artifact, candidate]
      properties:
        sourceSha: { type: string, pattern: '^[0-9a-f]{40}$' }
        artifact: { type: string, pattern: '^.+@sha256:[0-9a-f]{64}$' }
        candidate: { $ref: '#/components/schemas/ReleaseCandidate' }
    ReleaseCandidate:
      type: object
      additionalProperties: false
      required: [provider, repository, repositoryId, ownerId, repositoryVisibility, runId, runAttempt, workflowRef, workflowSha, signerWorkflowRef, signerWorkflowSha, ref, attestation]
      properties:
        provider: { const: github-actions }
        repository: { type: string }
        repositoryId: { type: string, pattern: '^[1-9][0-9]*$' }
        ownerId: { type: string, pattern: '^[1-9][0-9]*$' }
        repositoryVisibility: { type: string, enum: [public, private, internal], readOnly: true, description: Server-derived from the verified GitHub OIDC identity. }
        runId: { type: string }
        runAttempt: { type: string }
        workflowRef: { type: string }
        workflowSha: { type: string, pattern: '^[0-9a-f]{40}$' }
        signerWorkflowRef: { type: string, readOnly: true, description: Server-derived from the verified GitHub OIDC identity. }
        signerWorkflowSha: { type: string, pattern: '^[0-9a-f]{40}$', readOnly: true, description: Server-derived from the verified GitHub OIDC identity. }
        ref: { type: string }
        attestation: { $ref: '#/components/schemas/ReleaseAttestationIdentity' }
    ReleaseAttestationIdentity:
      type: object
      additionalProperties: false
      required: [mode, issuer, subjectDigest, materialSha]
      properties:
        mode: { type: string, enum: [github-public, github-private, norn-signed-private], readOnly: true, description: Server-derived from verified GitHub OIDC identity plus the control-plane trust policy. }
        verifier: { type: string, readOnly: true, description: Server-derived display label with no credential or identity data. }
        issuer: { const: 'https://token.actions.githubusercontent.com' }
        subjectDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        materialSha: { type: string, pattern: '^[0-9a-f]{40}$' }
        bundle: { $ref: '#/components/schemas/ReleaseAttestationBundle' }
    DSSEEnvelope:
      type: object
      additionalProperties: false
      required: [payloadType, payload, signatures]
      properties:
        payloadType: { type: string }
        payload: { type: string }
        signatures:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [keyid, sig]
            properties:
              keyid: { type: string }
              sig: { type: string }
    ReleaseAttestationBundle:
      type: object
      additionalProperties: false
      required: [schemaVersion, keyId, provenance, sbom]
      properties:
        schemaVersion: { const: norn.private-release-attestation/v1 }
        keyId: { type: string }
        provenance: { $ref: '#/components/schemas/DSSEEnvelope' }
        sbom: { $ref: '#/components/schemas/DSSEEnvelope' }
    PrivateReleaseAttestationRequest:
      type: object
      additionalProperties: false
      required: [sourceSha, artifact, sbom]
      properties:
        sourceSha: { type: string, pattern: '^[0-9a-f]{40}$' }
        artifact: { type: string, pattern: '^.+@sha256:[0-9a-f]{64}$' }
        sbom: { type: object, description: SPDX JSON document; request is capped at 3 MiB and decoded evidence at 2 MiB. }
    PrivateReleaseAttestationResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, candidate]
      properties:
        schemaVersion: { const: norn.private-release-attestation/v1 }
        candidate: { $ref: '#/components/schemas/ReleaseCandidate' }
    ReleaseQualification:
      type: object
      required: [schemaVersion, id, app, environment, deploymentId, sourceSha, artifact, issuedAt, expiresAt, keyId, signature, candidate, dsse]
      properties:
        schemaVersion: { const: norn.release-qualification/v2 }
        id: { type: string, format: uuid }
        app: { type: string }
        environment: { const: staging }
        deploymentId: { type: string, format: uuid }
        sourceSha: { type: string, pattern: '^[0-9a-f]{40}$' }
        artifact: { type: string, pattern: '^.+@sha256:[0-9a-f]{64}$' }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        keyId: { type: string }
        signature: { type: string }
        candidate: { $ref: '#/components/schemas/ReleaseCandidate' }
        dsse: { type: object }
    ReleasePromotionRequest:
      type: object
      required: [sourceSha, artifact, qualification]
      properties:
        sourceSha: { type: string, pattern: '^[0-9a-f]{40}$' }
        artifact: { type: string, pattern: '^.+@sha256:[0-9a-f]{64}$' }
        qualification: { $ref: '#/components/schemas/ReleaseQualification' }
    ReleaseRollbackRequest:
      type: object
      required: [deploymentId, sourceSha, artifact, confirm]
      properties:
        deploymentId: { type: string, format: uuid }
        sourceSha: { type: string, pattern: '^[0-9a-f]{40}$' }
        artifact: { type: string, pattern: '^.+@sha256:[0-9a-f]{64}$' }
        confirm: { const: true }
