        - invalid_event_filter
        - invalid_heartbeat
        - event_store_unavailable
        - event_cursor_gap
        - event_cursor_ahead
        - operation_not_found
        - operation_lookup_failed
        - operation_create_failed
        - operation_cancel_failed
        - operation_not_cancelable
        - invalid_idempotency_key
        - idempotency_key_reused
        - app_operation_active
        - postgres_not_configured
        - migration_not_configured
        - confirmation_required
        - invalid_snapshot_retention
        - invalid_snapshot_restore
        - invalid_snapshot_timestamp
        - invalid_snapshot_identifier
        - invalid_migration_request
