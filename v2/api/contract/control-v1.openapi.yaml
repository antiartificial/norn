openapi: 3.1.0
info:
  title: Norn Control Protocol
  version: 1.8.0
  description: Versioned contract for native and automated Norn control clients.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      security: []
      responses:
        '200':
          description: Negotiated server capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
  /api/v1/openapi.yaml:
    get:
      operationId: getOpenAPIContract
      security: []
      responses:
        '200':
          description: This OpenAPI 3.1 contract
          content:
            application/yaml:
              schema: { type: string }
  /api/v1/apps:
    get:
      operationId: listApps
      responses:
        '200':
          description: Versioned app status list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AppStatus' }
    post:
      operationId: createApp
      description: Creates a disabled InfraSpec draft. Returns app_catalog_read_only when the reviewed app catalog is configured immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAppRequest' }
      responses:
        '201':
          description: Disabled InfraSpec draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppMutationReceipt' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/validate/infraspec:
    post:
      operationId: validateInfraSpecDocument
      description: Strictly validates one uploaded InfraSpec and optionally cross-checks logical node-pool references against a fleet document. It never persists or deploys the document.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentValidationRequest' }
      responses:
        '200':
          description: Validation report; invalid documents are represented by valid=false, not an HTTP failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfraSpecValidationReport' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/fleet/validate:
    post:
      operationId: validateFleetDocument
      description: Strictly validates the norn.dev/fleet/v1 Cluster schema and production infrastructure sanity constraints. No cloud API is called.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentValidationRequest' }
      responses:
        '200':
          description: Fleet validation report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetValidationReport' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/fleet/node-pools:
    get:
      operationId: getFleetNodePools
      description: Returns desired node pools from the read-only NORN_FLEET_CONFIG checkout and its validation status. Source is a logical file identifier, never a host path. Requires api:read.
      responses:
        '200':
          description: Desired fleet inventory, or configured=false when no checkout is configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetInventory' }
        '500': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/fleet/plans:
    get:
      operationId: listFleetCapacityPlans
      description: Lists fleet capacity plans. Requires api:read.
      responses:
        '200':
          description: Durable, planning-only fleet operations
          content:
            application/json:
              schema:
                type: object
                required: [plans, count]
                properties:
                  plans: { type: array, items: { $ref: '#/components/schemas/Operation' } }
                  count: { type: integer }
        '503': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/fleet/github:
    get:
      operationId: getFleetGitHubStatus
      description: Verifies the repository-restricted GitHub App installation without exposing its private key or short-lived installation token. Requires api:read.
      responses:
        '200':
          description: Value-safe GitHub App connection status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetGitHubStatus' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/fleet/plans/{planID}/github/pull-request:
    parameters:
      - { name: planID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: createFleetGitHubPullRequest
      description: Creates or recovers the deterministic GitHub branch and pull request for a source-digest-bound fleet plan. Requires api:write. No provider credential enters Norn.
      responses:
        '200':
          description: Existing durable pull-request receipt
          content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } }
        '201':
          description: Pull request created or recovered and durably recorded
          content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/fleet/plans/{planID}/github/dispatch:
    parameters:
      - { name: planID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: dispatchFleetGitHubApply
      description: Finds the merged plan PR and successful main-branch plan artifact, then creates or recovers the protected apply dispatch. Requires api:write.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FleetGitHubDispatchRequest' }
      responses:
        '200':
          description: Existing durable dispatch receipt
          content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } }
        '201':
          description: Protected apply dispatched or recovered and durably recorded
          content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/fleet/plans/{planID}/reconciliations:
    parameters:
      - { name: planID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listFleetReconciliations
      description: Lists append-only infrastructure reconciliation checkpoints for a durable capacity plan. api:read sees the plan history; fleet:operate requires attemptId and receives only that exact bound attempt's records.
      parameters:
        - { name: attemptId, in: query, required: false, description: Required for fleet:operate runner reads; ignored for api:read all-plan reads., schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Durable reconciliation checkpoint operations
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, planId, reconciliations, count]
                properties:
                  schemaVersion: { const: norn.fleet-reconciliation/v1 }
                  planId: { type: string, format: uuid }
                  reconciliations: { type: array, items: { $ref: '#/components/schemas/Operation' } }
                  count: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      operationId: recordFleetReconciliation
      description: Appends a plan-, commit-, state-, evidence-, and required runner-attempt-bound recovery checkpoint. Successful phases are accepted only in lifecycle order. Requires the exact bound GitHub Actions fleet:operate identity.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FleetReconciliationRequest' }
      responses:
        '200':
          description: Existing checkpoint returned for an idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '201':
          description: Reconciliation checkpoint recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/fleet/plans/{planID}/attempts:
    parameters:
      - { name: planID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listFleetRunnerAttempts
      description: Lists durable runner attempts and marks active attempts abandoned when their heartbeat deadline has elapsed. Requires api:read.
      responses:
        '200':
          description: Runner attempts ordered newest first
          content: { application/json: { schema: { $ref: '#/components/schemas/FleetRunnerAttemptList' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      operationId: startFleetRunnerAttempt
      description: Starts or recovers an external protected-runner attempt bound to one plan, reviewed commit, and Terraform plan digest. A protected runner may also bind a sanitized reviewed-plan timing classification; timing is advisory only. Requires the exact bound GitHub Actions fleet:operate identity.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FleetRunnerAttemptStartRequest' } } }
      responses:
        '200': { description: Existing runner identity recovered, content: { application/json: { schema: { $ref: '#/components/schemas/FleetRunnerAttempt' } } } }
        '201': { description: Durable runner attempt started, content: { application/json: { schema: { $ref: '#/components/schemas/FleetRunnerAttempt' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/fleet/plans/{planID}/attempts/{attemptID}:
    parameters:
      - { name: planID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: attemptID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getFleetRunnerAttempt
      description: api:read may read any attempt; fleet:operate may read only the exact attempt bound to its current GitHub Actions identity.
      responses:
        '200': { description: Durable runner attempt, content: { application/json: { schema: { $ref: '#/components/schemas/FleetRunnerAttempt' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/fleet/plans/{planID}/attempts/{attemptID}/heartbeat:
    parameters:
      - { name: planID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: attemptID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: heartbeatFleetRunnerAttempt
      description: Renews liveness for the exact current phase using a monotonic sequence and optimistic revision. Requires the exact bound GitHub Actions fleet:operate identity.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FleetRunnerHeartbeatRequest' } } } }
      responses:
        '200': { description: Heartbeat recorded, content: { application/json: { schema: { $ref: '#/components/schemas/FleetRunnerAttempt' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/fleet/plans/{planID}/attempts/{attemptID}/advance:
    parameters:
      - { name: planID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: attemptID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: advanceFleetRunnerAttempt
      description: Advances only after this attempt has append-only successful evidence for its current phase. Completing the complete phase terminates the attempt successfully. Requires the exact bound GitHub Actions fleet:operate identity.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FleetRunnerAdvanceRequest' } } } }
      responses:
        '200': { description: Attempt advanced, content: { application/json: { schema: { $ref: '#/components/schemas/FleetRunnerAttempt' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/fleet/plans/{planID}/attempts/{attemptID}/cancel:
    parameters:
      - { name: planID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: attemptID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: cancelFleetRunnerAttempt
      description: Durably cancels an active runner attempt using its current revision. External workflow cancellation remains the runner's responsibility. Requires the exact bound GitHub Actions fleet:operate identity.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FleetRunnerCancelRequest' } } } }
      responses:
        '200': { description: Attempt canceled, content: { application/json: { schema: { $ref: '#/components/schemas/FleetRunnerAttempt' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/fleet/node-pools/{pool}/plan:
    post:
      operationId: createFleetCapacityPlan
      description: Records a durable planning receipt. It does not call a provider or apply Terraform; configured production deployments add an HMAC signature. Requires api:write.
      parameters:
        - { name: pool, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FleetCapacityPlanRequest' }
      responses:
        '200':
          description: Existing plan returned for an idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '201':
          description: Durable capacity plan recorded; no provider mutation occurred.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/deployment:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' } }
    put:
      operationId: setAppDeployment
      description: Updates the deployment gate. Returns app_catalog_read_only when the reviewed app catalog is configured immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties: { enabled: { type: boolean } }
      responses:
        '200':
          description: Deployment gate updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppMutationReceipt' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/deployments:
    get:
      operationId: listDeploymentsV1
      description: Lists durable deployment history, including independently tracked regional status and traffic weights. Requires api:read.
      parameters:
        - { name: app, in: query, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' } }
        - { name: status, in: query, schema: { type: string, enum: [queued, building, testing, migrating, submitting, healthy, deployed, failed] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
      responses:
        '200':
          description: Versioned deployment history
          content: { application/json: { schema: { $ref: '#/components/schemas/DeploymentList' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/releases/deployments:
    parameters:
      - $ref: '#/components/parameters/AppID'
    post:
      operationId: queueReleaseDeployment
      description: Staging-only immutable release deployment. Requires release:stage and an Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseRequest' }
      responses:
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/releases/preflight:
    parameters:
      - $ref: '#/components/parameters/AppID'
    post:
      operationId: queueReleasePreflight
      description: Staging-only immutable release preflight. Requires release:stage and an Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseRequest' }
      responses:
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/external-deployments/begin:
    parameters:
      - $ref: '#/components/parameters/AppID'
    post:
      operationId: beginExternalFleetDeploymentAdmission
      description: Starts a v4 external Fleet admission for one stable logical deployment identity and returns a short-lived, one-use Norn nonce only after hash-only registration is durable. Requires fleet:external-admission from the exact protected Norn Fleet OIDC identity. The logical identity deliberately excludes retry-specific Nomad evaluation and allocation evidence. Reusing the same Idempotency-Key and identity after a lost terminal response returns the existing terminal admission; it never returns another raw nonce.
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalFleetAdmissionBeginRequest' }
      responses:
        '200':
          description: Existing terminal admission recovered by exact idempotent replay
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStoreCacheControl' }
            Pragma: { $ref: '#/components/headers/NoCachePragma' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ExternalFleetAdmissionReplayResponse' } } }
        '201':
          description: Short-lived admission nonce bound to the stable logical identity
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStoreCacheControl' }
            Pragma: { $ref: '#/components/headers/NoCachePragma' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ExternalFleetAdmissionNonceResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/external-deployments/resume:
    parameters:
      - $ref: '#/components/parameters/AppID'
    post:
      operationId: resumeExternalFleetDeploymentAdmission
      description: Resumes a durable v4 admission after an interrupted registration, claim, verification, or cleanup. The request must name the original admission and exactly repeat its logical identity under the original Idempotency-Key. It can return a rotated nonce only after the replacement hash is registered; it never accepts a new logical deployment identity.
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalFleetAdmissionResumeRequest' }
      responses:
        '200':
          description: Existing terminal admission recovered or current durable context returned
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStoreCacheControl' }
            Pragma: { $ref: '#/components/headers/NoCachePragma' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ExternalFleetAdmissionReplayResponse' } } }
        '201':
          description: A replacement nonce whose registration is durable
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStoreCacheControl' }
            Pragma: { $ref: '#/components/headers/NoCachePragma' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ExternalFleetAdmissionNonceResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/external-deployments/admit:
    parameters:
      - $ref: '#/components/parameters/AppID'
    post:
      operationId: admitExternalFleetDeploymentV4
      description: Accepts exactly the v4 admission envelope, claims its pre-registered nonce hash, and independently verifies the receipt before atomically admitting an immutable operation. The legacy receipt and issue-nonce forms are not accepted on this route. Requires fleet:external-admission from the exact protected Norn Fleet OIDC identity.
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalFleetDeploymentAdmissionRequest' }
      responses:
        '200':
          description: Existing immutable operation recovered by exact idempotent replay
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStoreCacheControl' }
            Pragma: { $ref: '#/components/headers/NoCachePragma' }
          content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } }
        '201':
          description: Immutable externally verified deployment operation admitted
          headers:
            Location: { schema: { type: string, format: uri-reference } }
            Cache-Control: { $ref: '#/components/headers/NoStoreCacheControl' }
            Pragma: { $ref: '#/components/headers/NoCachePragma' }
          content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/external-deployments/cleanup:
    parameters:
      - $ref: '#/components/parameters/AppID'
    post:
      operationId: cleanupExternalFleetDeploymentAdmission
      description: Completes durable v4 evidence-service cleanup after a terminal admission. Norn accepts cleanup only when immutable operation, receipt, cleanup-intent, and absence-proof digests match the server-owned admission; the raw nonce is never sent or stored in this request.
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalFleetAdmissionCleanupRequest' }
      responses:
        '200':
          description: Server-owned cleanup context
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStoreCacheControl' }
            Pragma: { $ref: '#/components/headers/NoCachePragma' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ExternalFleetAdmissionReplayResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/external-deployments/reconcile:
    parameters:
      - $ref: '#/components/parameters/AppID'
    post:
      operationId: reconcileExternalFleetDeploymentAdmission
      description: Reconciles only a durably pending v4 evidence-service commit. Norn reconstructs every CAS binding from its persisted admission and operation; callers never provide a nonce, snapshot, receipt, proof, or cleanup digest.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalFleetAdmissionReconcileRequest' }
      responses:
        '200':
          description: Durable pending or cleanup-pending admission state
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStoreCacheControl' }
            Pragma: { $ref: '#/components/headers/NoCachePragma' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ExternalFleetAdmissionReplayResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/external-deployments/context/{admissionId}:
    parameters:
      - $ref: '#/components/parameters/AppID'
      - name: admissionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getExternalFleetDeploymentAdmissionContext
      description: Returns server-owned v4 admission state, retry lineage, and checkpoint references. Requires fleet:external-admission.
      responses:
        '200':
          description: Durable external Fleet admission context
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStoreCacheControl' }
            Pragma: { $ref: '#/components/headers/NoCachePragma' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ExternalFleetAdmissionContext' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/private-attestations:
    parameters:
      - $ref: '#/components/parameters/AppID'
    post:
      operationId: createPrivateReleaseAttestation
      description: Issues server-canonical DSSE provenance and SPDX evidence for an OIDC-authenticated ordinary private repository. Available only in staging with norn-signed-private trust.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PrivateReleaseAttestationRequest' } } }
      responses:
        '201': { description: Portable signed private evidence, content: { application/json: { schema: { $ref: '#/components/schemas/PrivateReleaseAttestationResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/qualifications:
    parameters:
      - $ref: '#/components/parameters/AppID'
    get:
      operationId: listReleaseQualifications
      description: Returns at most the three most recent unexpired full signed qualifications. Large embedded private evidence is intentionally bounded.
      responses:
        '200': { description: Signed staging qualifications, content: { application/json: { schema: { type: object } } } }
    post:
      operationId: createReleaseQualification
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [deploymentId], properties: { deploymentId: { type: string, format: uuid } } } } }
      responses:
        '201': { description: Signed staging qualification, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseQualification' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/promotions:
    parameters:
      - $ref: '#/components/parameters/AppID'
    post:
      operationId: queueReleasePromotion
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReleasePromotionRequest' } } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/releases/rollbacks:
    parameters:
      - $ref: '#/components/parameters/AppID'
    post:
      operationId: queueReleaseRollback
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseRollbackRequest' } } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/auth/github-actions/exchange:
    post:
      operationId: exchangeGitHubActionsOIDC
      description: Exchanges a verified GitHub Actions OIDC bearer assertion for a short-lived Norn release token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scope, environment]
              properties:
                scope: { type: string, enum: ['release:attest', 'release:stage', 'release:qualify', 'release:promote', 'release:rollback', 'fleet:operate', 'fleet:external-admission'] }
                app: { type: string, description: 'Required for release scopes; optional and exact-route-bound for fleet:external-admission; omitted for fleet:operate.' }
                environment: { type: string }
                intent: { type: string }
              allOf:
                - if: { properties: { scope: { enum: ['release:attest', 'release:stage', 'release:qualify', 'release:promote', 'release:rollback'] } }, required: [scope] }
                  then: { required: [app] }
      responses:
        '201':
          description: Exchange token created. Release exchanges include the server-selected attestationMode.
          content:
            application/json:
              schema:
                type: object
                required: [token, tokenId, scopes, environment, expiresAt, subject]
                properties:
                  token: { type: string }
                  tokenId: { type: string }
                  scopes: { type: array, items: { type: string } }
                  app: { type: string }
                  environment: { type: string }
                  expiresAt: { type: string, format: date-time }
                  subject: { type: string }
                  attestationMode: { type: string, enum: [github-public, github-private, norn-signed-private] }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/deployments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getDeploymentV1
      responses:
        '200':
          description: Versioned deployment record
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, deployment]
                properties:
                  schemaVersion: { const: norn.deployment/v1 }
                  deployment: { $ref: '#/components/schemas/Deployment' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/deployments/{id}/steps:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listDeploymentStepsV1
      description: Lists typed read-only and mutable deployment stages with attempts and terminal evidence. Requires api:read.
      responses:
        '200':
          description: Versioned deployment steps
          content: { application/json: { schema: { $ref: '#/components/schemas/DeploymentStepList' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/services/manifest:
    get:
      operationId: getServiceManifestV1
      description: Returns service instances with allocation, region, node-pool, and placement-proof metadata. Requires api:read.
      responses:
        '200':
          description: Versioned service topology manifest
          content: { application/json: { schema: { $ref: '#/components/schemas/ServiceManifest' } } }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/snapshots:
    parameters:
      - $ref: '#/components/parameters/AppID'
    get:
      operationId: listAppSnapshots
      responses:
        '200':
          description: Local PostgreSQL snapshots, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AppSnapshot' } }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: queueAppSnapshot
      description: Queues a resumable manual database snapshot. Requires api:write.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        '200': { $ref: '#/components/responses/AcceptedOperation' }
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/snapshots/retention:
    post:
      operationId: queueAppSnapshotRetention
      description: Queues deterministic pruning of all but the newest keep snapshots. The client should preview the affected snapshot list before confirmation.
      parameters:
        - $ref: '#/components/parameters/AppID'
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keep, confirm]
              properties:
                keep: { type: integer, minimum: 1, maximum: 1000 }
                confirm: { const: true }
      responses:
        '200': { $ref: '#/components/responses/AcceptedOperation' }
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/snapshots/{snapshot}/restore:
    post:
      operationId: queueAppSnapshotRestore
      description: Queues a database restore by exact inventory filename (preferred) or legacy UTC timestamp. Norn always creates a pre-restore safety snapshot before changing the database.
      parameters:
        - $ref: '#/components/parameters/AppID'
        - { name: snapshot, in: path, required: true, description: Exact filename returned by snapshot inventory, or a legacy timestamp when it identifies exactly one snapshot., schema: { type: string, pattern: '^([0-9]{8}T[0-9]{6}|[A-Za-z0-9_.-]{1,240}[.]dump)$' } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties: { confirm: { const: true } }
      responses:
        '200': { $ref: '#/components/responses/AcceptedOperation' }
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/migrations:
    post:
      operationId: queueAppMigration
      description: Queues the InfraSpec migrations command independently of deployment. Norn prepares the requested source and creates a pre-migration snapshot before mutation.
      parameters:
        - $ref: '#/components/parameters/AppID'
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                ref: { type: string, default: HEAD }
                confirm: { const: true }
      responses:
        '200': { $ref: '#/components/responses/AcceptedOperation' }
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/rollbacks:
    post:
      operationId: queueAppRollback
      description: Queues rollback to the previous successful deployment, optionally scoped to declared regions.
      parameters:
        - $ref: '#/components/parameters/AppID'
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                regions: { type: array, items: { type: string } }
                confirm: { const: true }
      responses:
        '200': { $ref: '#/components/responses/AcceptedOperation' }
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/enrollments:
    post:
      operationId: startDeviceEnrollment
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollmentStartRequest' }
      responses:
        '201':
          description: Short-lived pairing session. Keep verifier secret on the requesting device.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentStartResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '426': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listDeviceEnrollments
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, exchanged, expired, locked] } }
      responses:
        '200':
          description: Recent enrollment requests; requires admin scope.
          content:
            application/json:
              schema:
                type: object
                required: [enrollments]
                properties:
                  enrollments: { type: array, items: { $ref: '#/components/schemas/Enrollment' } }
  /api/v1/enrollments/approve:
    post:
      operationId: approveDeviceEnrollment
      description: Approves a user-visible pairing code; requires admin scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userCode]
              properties:
                userCode: { type: string }
                scopes: { type: array, items: { type: string } }
      responses:
        '200':
          description: Approved enrollment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '426': { $ref: '#/components/responses/Problem' }
  /api/v1/enrollments/{id}/exchange:
    post:
      operationId: exchangeDeviceEnrollment
      security: []
      parameters:
        - $ref: '#/components/parameters/EnrollmentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verifier]
              properties: { verifier: { type: string, maxLength: 128 } }
      responses:
        '200':
          description: One-time device token exchange
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedToken' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '426': { $ref: '#/components/responses/Problem' }
  /api/v1/devices:
    get:
      operationId: listDevices
      description: Lists enrolled devices and token metadata; requires admin scope.
      responses:
        '200':
          description: Enrolled devices
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices: { type: array, items: { $ref: '#/components/schemas/Device' } }
  /api/v1/devices/{id}:
    delete:
      operationId: revokeDevice
      description: Revokes a device and all of its tokens; requires admin scope.
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      responses:
        '204': { description: Device and tokens revoked }
  /api/v1/auth/rotate:
    post:
      operationId: rotateCurrentToken
      responses:
        '200':
          description: Replacement token; the current token is atomically revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedToken' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/auth/revoke:
    post:
      operationId: revokeCurrentToken
      responses:
        '204': { description: Current managed token revoked }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/auth/step-up/challenges:
    post:
      operationId: createStepUpChallenge
      description: Creates an app-bound proof-of-possession challenge for an enrolled device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, resource]
              properties:
                purpose: { const: exec }
                resource: { type: string, description: App ID }
      responses:
        '201':
          description: Sign signaturePayload as UTF-8 bytes using ECDSA P-256 with SHA-256 and return the ASN.1 signature.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepUpChallenge' }
        '412': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /api/v1/auth/step-up/challenges/{id}/verify:
    post:
      operationId: verifyStepUpChallenge
      parameters:
        - $ref: '#/components/parameters/ChallengeID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nonce, signature]
              properties:
                nonce: { type: string }
                signature: { type: string, maxLength: 256, description: Base64url ASN.1 ECDSA signature }
      responses:
        '200':
          description: Short-lived, one-time step-up capability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepUpAuthorization' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}:
    get:
      operationId: getApp
      parameters:
        - $ref: '#/components/parameters/AppID'
      responses:
        '200':
          description: Versioned app status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppStatus' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/exec-sessions:
    post:
      operationId: createExecSession
      description: Creates a durable exec session and atomically consumes an app-bound step-up authorization.
      parameters:
        - $ref: '#/components/parameters/AppID'
        - $ref: '#/components/parameters/StepUpToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecSessionRequest' }
      responses:
        '201':
          description: Exec session ready to connect
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecSessionCreated' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /api/v1/exec-sessions:
    get:
      operationId: listExecSessions
      description: Lists the current device's audit records; admin tokens can list all records.
      responses:
        '200':
          description: Exec session audit records
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions: { type: array, items: { $ref: '#/components/schemas/ExecSession' } }
  /api/v1/exec-sessions/{id}:
    get:
      operationId: getExecSession
      parameters: [ { $ref: '#/components/parameters/ExecSessionID' } ]
      responses:
        '200':
          description: Exec session audit record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecSession' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: cancelExecSession
      parameters: [ { $ref: '#/components/parameters/ExecSessionID' } ]
      responses:
        '204': { description: Session canceled; an active WebSocket is closed. }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/exec-sessions/{id}/stream:
    get:
      operationId: connectExecSession
      description: Upgrades exactly once to the norn.exec/v1 WebSocket protocol.
      parameters: [ { $ref: '#/components/parameters/ExecSessionID' } ]
      responses:
        '101': { description: Typed terminal WebSocket }
        '409': { $ref: '#/components/responses/Problem' }
      x-websocket-messages:
        client:
          oneOf:
            - { $ref: '#/components/schemas/ExecInputFrame' }
            - { $ref: '#/components/schemas/ExecResizeFrame' }
            - { $ref: '#/components/schemas/ExecCloseInputFrame' }
        server:
          oneOf:
            - { $ref: '#/components/schemas/ExecReadyFrame' }
            - { $ref: '#/components/schemas/ExecOutputFrame' }
            - { $ref: '#/components/schemas/ExecErrorFrame' }
            - { $ref: '#/components/schemas/ExecExitFrame' }
  /api/v1/releases:
    get:
      operationId: listReleases
      responses:
        '200':
          description: Platform release history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseList' }
  /api/v1/host/status:
    get:
      operationId: getHostStatus
      responses:
        '200':
          description: Host and independent assurance status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostStatus' }
  /api/v1/host/metrics:
    get:
      operationId: getHostMetrics
      description: >-
        Authenticated machine-wide host CPU and memory telemetry. Requires api:read.
        On macOS, memory available is free plus reclaimable inactive and speculative pages.
      responses:
        '200':
          description: Cached host metrics sample
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostMetrics' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/host/runtime:
    get:
      operationId: getHostRuntime
      description: Authenticated workload connector and container runtime inventory. Requires api:read.
      responses:
        '200':
          description: Active connector plus available connector and runtime capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostRuntime' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/production/readiness:
    get:
      operationId: getProductionReadiness
      description: >-
        Authenticated, value-safe production admission report covering control authentication,
        Nomad and Consul security and quorum, database transport, secrets, provenance,
        recovery, and observability. Requires api:read.
      responses:
        '200':
          description: Deterministic production-readiness report
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionReadinessReport' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/audit/mutations:
    get:
      operationId: listMutationAudits
      description: Lists integrity-checked, principal-aware mutation receipts. Requires admin scope.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Durable mutation audit receipts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationAuditList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/audit/mutations/{id}/incident:
    post:
      operationId: acknowledgeMutationAuditIncident
      description: >-
        Persists a signed incident acknowledgement for one invalid completed mutation receipt.
        The original receipt remains immutable and visible. Requires admin scope.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MutationAuditIncidentRequest' }
      responses:
        '201':
          description: Signed incident acknowledgement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationAuditIncident' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/production/drills:
    get:
      operationId: listRecoveryDrills
      description: Lists durable recovery-drill receipts. Requires admin scope.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Recovery drills and required production kinds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryDrillList' }
    post:
      operationId: startRecoveryDrill
      description: Starts a durable recovery-drill receipt. Requires admin scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoveryDrillStartRequest' }
      responses:
        '201':
          description: Recovery drill started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryDrill' }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/production/drills/{id}/complete:
    post:
      operationId: completeRecoveryDrill
      description: Completes a running recovery drill with bounded evidence. Requires admin scope.
      parameters:
        - $ref: '#/components/parameters/RecoveryDrillID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoveryDrillCompleteRequest' }
      responses:
        '200':
          description: Completed recovery drill
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryDrill' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/events/info:
    get:
      operationId: getEventStreamInfo
      responses:
        '200':
          description: Event retention, cursor, heartbeat, and filter capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventStreamInfo' }
  /api/v1/events:
    get:
      operationId: connectEvents
      description: >-
        Upgrade to WebSocket. Event frames use Event. When heartbeat is requested,
        heartbeat frames use HeartbeatFrame. A stale or ahead cursor is rejected
        before upgrade with event_cursor_gap or event_cursor_ahead.
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: types, in: query, schema: { type: string }, description: Comma-separated exact event types. }
        - { name: apps, in: query, schema: { type: string }, description: Comma-separated exact app IDs. }
        - { name: heartbeat, in: query, schema: { type: integer, minimum: 10, maximum: 120 } }
      responses:
        '101': { description: WebSocket event stream }
        '409': { $ref: '#/components/responses/Problem' }
      x-websocket-messages:
        server:
          oneOf:
            - { $ref: '#/components/schemas/Event' }
            - { $ref: '#/components/schemas/HeartbeatFrame' }
  /api/v1/operations/{id}:
    get:
      operationId: getOperation
      description: API readers receive the complete operation. A release- or Fleet-scoped CI token may read only its exact app/environment/CI-bound operation and receives a bounded status projection without candidate or qualification evidence.
      parameters:
        - $ref: '#/components/parameters/OperationID'
      responses:
        '200':
          description: Durable operation and typed terminal receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/operations/{id}/cancel:
    post:
      operationId: cancelOperation
      description: Cancels queued work. Running work returns operation_not_cancelable.
      parameters:
        - $ref: '#/components/parameters/OperationID'
      responses:
        '200':
          description: Canceled operation receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/platform/preflights:
    post:
      operationId: queuePlatformPreflight
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformRefRequest' }
      responses: { '202': { $ref: '#/components/responses/AcceptedOperation' } }
  /api/v1/platform/upgrades:
    post:
      operationId: queuePlatformUpgrade
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformUpgradeRequest' }
      responses: { '202': { $ref: '#/components/responses/AcceptedOperation' } }
  /api/v1/platform/rollbacks:
    post:
      operationId: queuePlatformRollback
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha]
              properties: { sha: { type: string } }
      responses: { '202': { $ref: '#/components/responses/AcceptedOperation' } }
  /api/v1/platform/smoke:
    post:
      operationId: queuePlatformSmoke
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '202': { $ref: '#/components/responses/AcceptedOperation' } }
  /api/v1/host/assurances:
    post:
      operationId: queueHostAssurance
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '202': { $ref: '#/components/responses/AcceptedOperation' } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    AppID: { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' } }
    OperationID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    EnrollmentID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    DeviceID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    ChallengeID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    ExecSessionID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    RecoveryDrillID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    StepUpToken: { name: X-Norn-Step-Up, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 200 } }
    RequiredIdempotencyKey: { name: Idempotency-Key, in: header, required: true, description: Stable client key bound to one logical external Fleet admission; it must be reused for recovery and must not be reused for another logical deployment., schema: { type: string, minLength: 1, maxLength: 200 } }
  headers:
    NoStoreCacheControl:
      description: Sensitive admission material and server-owned progress must not be cached.
      schema: { const: no-store }
    NoCachePragma:
      description: Compatibility cache-control directive for sensitive admission material.
      schema: { const: no-cache }
  responses:
    Problem:
      description: Stable machine-readable error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AcceptedOperation:
      description: Durable operation accepted
      headers:
        Location: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Operation' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { $ref: '#/components/schemas/ErrorCode' }
        detail: { type: string }
        requestId: { type: string }
        error: { type: string, deprecated: true }
        eventBounds: { $ref: '#/components/schemas/EventBounds' }
    ErrorCode:
      type: string
      description: Stable machine-readable code. Clients must preserve unknown future values.
      x-extensible-enum:
        - unauthorized
        - authenticated_principal_required
        - insufficient_scope
        - invalid_request
        - invalid_app_id
        - app_not_found
        - app_discovery_failed
        - invalid_deployment_id
        - deployment_not_found
