openapi: 3.1.0
info:
  title: Norn Control Protocol
  version: 1.6.0
  description: Versioned contract for native and automated Norn control clients.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      security: []
      responses:
        '200':
          description: Negotiated server capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
  /api/v1/openapi.yaml:
    get:
      operationId: getOpenAPIContract
      security: []
      responses:
        '200':
          description: This OpenAPI 3.1 contract
          content:
            application/yaml:
              schema: { type: string }
  /api/v1/apps:
    get:
      operationId: listApps
      responses:
        '200':
          description: Versioned app status list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AppStatus' }
    post:
      operationId: createApp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAppRequest' }
      responses:
        '201':
          description: Disabled InfraSpec draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppMutationReceipt' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/validate/infraspec:
    post:
      operationId: validateInfraSpecDocument
      description: Strictly validates one uploaded InfraSpec and optionally cross-checks logical node-pool references against a fleet document. It never persists or deploys the document.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentValidationRequest' }
      responses:
        '200':
          description: Validation report; invalid documents are represented by valid=false, not an HTTP failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfraSpecValidationReport' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/fleet/validate:
    post:
      operationId: validateFleetDocument
      description: Strictly validates the norn.dev/fleet/v1 Cluster schema and production infrastructure sanity constraints. No cloud API is called.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentValidationRequest' }
      responses:
        '200':
          description: Fleet validation report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetValidationReport' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/fleet/node-pools:
    get:
      operationId: getFleetNodePools
      description: Returns desired node pools from the read-only NORN_FLEET_CONFIG checkout and its validation status. Source is a logical file identifier, never a host path. Requires api:read.
      responses:
        '200':
          description: Desired fleet inventory, or configured=false when no checkout is configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetInventory' }
        '500': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/fleet/plans:
    get:
      operationId: listFleetCapacityPlans
      description: Lists fleet capacity plans. Requires api:read.
      responses:
        '200':
          description: Durable, planning-only fleet operations
          content:
            application/json:
              schema:
                type: object
                required: [plans, count]
                properties:
                  plans: { type: array, items: { $ref: '#/components/schemas/Operation' } }
                  count: { type: integer }
        '503': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/fleet/github:
    get:
      operationId: getFleetGitHubStatus
      description: Verifies the repository-restricted GitHub App installation without exposing its private key or short-lived installation token. Requires api:read.
      responses:
        '200':
          description: Value-safe GitHub App connection status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetGitHubStatus' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/fleet/plans/{planID}/github/pull-request:
    parameters:
      - { name: planID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: createFleetGitHubPullRequest
      description: Creates or recovers the deterministic GitHub branch and pull request for a source-digest-bound fleet plan. Requires api:write. No provider credential enters Norn.
      responses:
        '200':
          description: Existing durable pull-request receipt
          content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } }
        '201':
          description: Pull request created or recovered and durably recorded
          content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/fleet/plans/{planID}/github/dispatch:
    parameters:
      - { name: planID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: dispatchFleetGitHubApply
      description: Finds the merged plan PR and successful main-branch plan artifact, then creates or recovers the protected apply dispatch. Requires api:write.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FleetGitHubDispatchRequest' }
      responses:
        '200':
          description: Existing durable dispatch receipt
          content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } }
        '201':
          description: Protected apply dispatched or recovered and durably recorded
          content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/fleet/plans/{planID}/reconciliations:
    parameters:
      - { name: planID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listFleetReconciliations
      description: Lists append-only infrastructure reconciliation checkpoints for a durable capacity plan. Requires api:read.
      responses:
        '200':
          description: Durable reconciliation checkpoint operations
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, planId, reconciliations, count]
                properties:
                  schemaVersion: { const: norn.fleet-reconciliation/v1 }
                  planId: { type: string, format: uuid }
                  reconciliations: { type: array, items: { $ref: '#/components/schemas/Operation' } }
                  count: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      operationId: recordFleetReconciliation
      description: Appends a plan-, commit-, state-, and evidence-bound recovery checkpoint. Successful phases are accepted only in lifecycle order. Requires api:write.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FleetReconciliationRequest' }
      responses:
        '200':
          description: Existing checkpoint returned for an idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '201':
          description: Reconciliation checkpoint recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/fleet/node-pools/{pool}/plan:
    post:
      operationId: createFleetCapacityPlan
      description: Records a durable planning receipt. It does not call a provider or apply Terraform; configured production deployments add an HMAC signature. Requires api:write.
      parameters:
        - { name: pool, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FleetCapacityPlanRequest' }
      responses:
        '200':
          description: Existing plan returned for an idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '201':
          description: Durable capacity plan recorded; no provider mutation occurred.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/deployment:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' } }
    put:
      operationId: setAppDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties: { enabled: { type: boolean } }
      responses:
        '200':
          description: Deployment gate updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppMutationReceipt' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/snapshots:
    parameters:
      - $ref: '#/components/parameters/AppID'
    get:
      operationId: listAppSnapshots
      responses:
        '200':
          description: Local PostgreSQL snapshots, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AppSnapshot' } }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: queueAppSnapshot
      description: Queues a resumable manual database snapshot. Requires api:write.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        '200': { $ref: '#/components/responses/AcceptedOperation' }
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/snapshots/retention:
    post:
      operationId: queueAppSnapshotRetention
      description: Queues deterministic pruning of all but the newest keep snapshots. The client should preview the affected snapshot list before confirmation.
      parameters:
        - $ref: '#/components/parameters/AppID'
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keep, confirm]
              properties:
                keep: { type: integer, minimum: 1, maximum: 1000 }
                confirm: { const: true }
      responses:
        '200': { $ref: '#/components/responses/AcceptedOperation' }
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/snapshots/{ts}/restore:
    post:
      operationId: queueAppSnapshotRestore
      description: Queues a database restore. Norn always creates a pre-restore safety snapshot before changing the database.
      parameters:
        - $ref: '#/components/parameters/AppID'
        - { name: ts, in: path, required: true, schema: { type: string, pattern: '^[0-9]{8}T[0-9]{6}$' } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties: { confirm: { const: true } }
      responses:
        '200': { $ref: '#/components/responses/AcceptedOperation' }
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/migrations:
    post:
      operationId: queueAppMigration
      description: Queues the InfraSpec migrations command independently of deployment. Norn prepares the requested source and creates a pre-migration snapshot before mutation.
      parameters:
        - $ref: '#/components/parameters/AppID'
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                ref: { type: string, default: HEAD }
                confirm: { const: true }
      responses:
        '200': { $ref: '#/components/responses/AcceptedOperation' }
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/rollbacks:
    post:
      operationId: queueAppRollback
      description: Queues rollback to the previous successful deployment, optionally scoped to declared regions.
      parameters:
        - $ref: '#/components/parameters/AppID'
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                regions: { type: array, items: { type: string } }
                confirm: { const: true }
      responses:
        '200': { $ref: '#/components/responses/AcceptedOperation' }
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/enrollments:
    post:
      operationId: startDeviceEnrollment
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollmentStartRequest' }
      responses:
        '201':
          description: Short-lived pairing session. Keep verifier secret on the requesting device.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentStartResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '426': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listDeviceEnrollments
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, exchanged, expired, locked] } }
      responses:
        '200':
          description: Recent enrollment requests; requires admin scope.
          content:
            application/json:
              schema:
                type: object
                required: [enrollments]
                properties:
                  enrollments: { type: array, items: { $ref: '#/components/schemas/Enrollment' } }
  /api/v1/enrollments/approve:
    post:
      operationId: approveDeviceEnrollment
      description: Approves a user-visible pairing code; requires admin scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userCode]
              properties:
                userCode: { type: string }
                scopes: { type: array, items: { type: string } }
      responses:
        '200':
          description: Approved enrollment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '426': { $ref: '#/components/responses/Problem' }
  /api/v1/enrollments/{id}/exchange:
    post:
      operationId: exchangeDeviceEnrollment
      security: []
      parameters:
        - $ref: '#/components/parameters/EnrollmentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verifier]
              properties: { verifier: { type: string, maxLength: 128 } }
      responses:
        '200':
          description: One-time device token exchange
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedToken' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '426': { $ref: '#/components/responses/Problem' }
  /api/v1/devices:
    get:
      operationId: listDevices
      description: Lists enrolled devices and token metadata; requires admin scope.
      responses:
        '200':
          description: Enrolled devices
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices: { type: array, items: { $ref: '#/components/schemas/Device' } }
  /api/v1/devices/{id}:
    delete:
      operationId: revokeDevice
      description: Revokes a device and all of its tokens; requires admin scope.
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      responses:
        '204': { description: Device and tokens revoked }
  /api/v1/auth/rotate:
    post:
      operationId: rotateCurrentToken
      responses:
        '200':
          description: Replacement token; the current token is atomically revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedToken' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/auth/revoke:
    post:
      operationId: revokeCurrentToken
      responses:
        '204': { description: Current managed token revoked }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/auth/step-up/challenges:
    post:
      operationId: createStepUpChallenge
      description: Creates an app-bound proof-of-possession challenge for an enrolled device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, resource]
              properties:
                purpose: { const: exec }
                resource: { type: string, description: App ID }
      responses:
        '201':
          description: Sign signaturePayload as UTF-8 bytes using ECDSA P-256 with SHA-256 and return the ASN.1 signature.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepUpChallenge' }
        '412': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /api/v1/auth/step-up/challenges/{id}/verify:
    post:
      operationId: verifyStepUpChallenge
      parameters:
        - $ref: '#/components/parameters/ChallengeID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nonce, signature]
              properties:
                nonce: { type: string }
                signature: { type: string, maxLength: 256, description: Base64url ASN.1 ECDSA signature }
      responses:
        '200':
          description: Short-lived, one-time step-up capability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepUpAuthorization' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}:
    get:
      operationId: getApp
      parameters:
        - $ref: '#/components/parameters/AppID'
      responses:
        '200':
          description: Versioned app status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppStatus' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/apps/{id}/exec-sessions:
    post:
      operationId: createExecSession
      description: Creates a durable exec session and atomically consumes an app-bound step-up authorization.
      parameters:
        - $ref: '#/components/parameters/AppID'
        - $ref: '#/components/parameters/StepUpToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecSessionRequest' }
      responses:
        '201':
          description: Exec session ready to connect
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecSessionCreated' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /api/v1/exec-sessions:
    get:
      operationId: listExecSessions
      description: Lists the current device's audit records; admin tokens can list all records.
      responses:
        '200':
          description: Exec session audit records
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions: { type: array, items: { $ref: '#/components/schemas/ExecSession' } }
  /api/v1/exec-sessions/{id}:
    get:
      operationId: getExecSession
      parameters: [ { $ref: '#/components/parameters/ExecSessionID' } ]
      responses:
        '200':
          description: Exec session audit record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecSession' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: cancelExecSession
      parameters: [ { $ref: '#/components/parameters/ExecSessionID' } ]
      responses:
        '204': { description: Session canceled; an active WebSocket is closed. }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/exec-sessions/{id}/stream:
    get:
      operationId: connectExecSession
      description: Upgrades exactly once to the norn.exec/v1 WebSocket protocol.
      parameters: [ { $ref: '#/components/parameters/ExecSessionID' } ]
      responses:
        '101': { description: Typed terminal WebSocket }
        '409': { $ref: '#/components/responses/Problem' }
      x-websocket-messages:
        client:
          oneOf:
            - { $ref: '#/components/schemas/ExecInputFrame' }
            - { $ref: '#/components/schemas/ExecResizeFrame' }
            - { $ref: '#/components/schemas/ExecCloseInputFrame' }
        server:
          oneOf:
            - { $ref: '#/components/schemas/ExecReadyFrame' }
            - { $ref: '#/components/schemas/ExecOutputFrame' }
            - { $ref: '#/components/schemas/ExecErrorFrame' }
            - { $ref: '#/components/schemas/ExecExitFrame' }
  /api/v1/releases:
    get:
      operationId: listReleases
      responses:
        '200':
          description: Platform release history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseList' }
  /api/v1/host/status:
    get:
      operationId: getHostStatus
      responses:
        '200':
          description: Host and independent assurance status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostStatus' }
  /api/v1/host/metrics:
    get:
      operationId: getHostMetrics
      description: >-
        Authenticated machine-wide host CPU and memory telemetry. Requires api:read.
        On macOS, memory available is free plus reclaimable inactive and speculative pages.
      responses:
        '200':
          description: Cached host metrics sample
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostMetrics' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/production/readiness:
    get:
      operationId: getProductionReadiness
      description: >-
        Authenticated, value-safe production admission report covering control authentication,
        Nomad and Consul security and quorum, database transport, secrets, provenance,
        recovery, and observability. Requires api:read.
      responses:
        '200':
          description: Deterministic production-readiness report
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionReadinessReport' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/audit/mutations:
    get:
      operationId: listMutationAudits
      description: Lists integrity-checked, principal-aware mutation receipts. Requires admin scope.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Durable mutation audit receipts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationAuditList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/audit/mutations/{id}/incident:
    post:
      operationId: acknowledgeMutationAuditIncident
      description: >-
        Persists a signed incident acknowledgement for one invalid completed mutation receipt.
        The original receipt remains immutable and visible. Requires admin scope.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MutationAuditIncidentRequest' }
      responses:
        '201':
          description: Signed incident acknowledgement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationAuditIncident' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/production/drills:
    get:
      operationId: listRecoveryDrills
      description: Lists durable recovery-drill receipts. Requires admin scope.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Recovery drills and required production kinds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryDrillList' }
    post:
      operationId: startRecoveryDrill
      description: Starts a durable recovery-drill receipt. Requires admin scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoveryDrillStartRequest' }
      responses:
        '201':
          description: Recovery drill started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryDrill' }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/production/drills/{id}/complete:
    post:
      operationId: completeRecoveryDrill
      description: Completes a running recovery drill with bounded evidence. Requires admin scope.
      parameters:
        - $ref: '#/components/parameters/RecoveryDrillID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoveryDrillCompleteRequest' }
      responses:
        '200':
          description: Completed recovery drill
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryDrill' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/events/info:
    get:
      operationId: getEventStreamInfo
      responses:
        '200':
          description: Event retention, cursor, heartbeat, and filter capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventStreamInfo' }
  /api/v1/events:
    get:
      operationId: connectEvents
      description: >-
        Upgrade to WebSocket. Event frames use Event. When heartbeat is requested,
        heartbeat frames use HeartbeatFrame. A stale or ahead cursor is rejected
        before upgrade with event_cursor_gap or event_cursor_ahead.
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: types, in: query, schema: { type: string }, description: Comma-separated exact event types. }
        - { name: apps, in: query, schema: { type: string }, description: Comma-separated exact app IDs. }
        - { name: heartbeat, in: query, schema: { type: integer, minimum: 10, maximum: 120 } }
      responses:
        '101': { description: WebSocket event stream }
        '409': { $ref: '#/components/responses/Problem' }
      x-websocket-messages:
        server:
          oneOf:
            - { $ref: '#/components/schemas/Event' }
            - { $ref: '#/components/schemas/HeartbeatFrame' }
  /api/v1/operations/{id}:
    get:
      operationId: getOperation
      parameters:
        - $ref: '#/components/parameters/OperationID'
      responses:
        '200':
          description: Durable operation and typed terminal receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/operations/{id}/cancel:
    post:
      operationId: cancelOperation
      description: Cancels queued work. Running work returns operation_not_cancelable.
      parameters:
        - $ref: '#/components/parameters/OperationID'
      responses:
        '200':
          description: Canceled operation receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/platform/preflights:
    post:
      operationId: queuePlatformPreflight
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformRefRequest' }
      responses: { '202': { $ref: '#/components/responses/AcceptedOperation' } }
  /api/v1/platform/upgrades:
    post:
      operationId: queuePlatformUpgrade
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformUpgradeRequest' }
      responses: { '202': { $ref: '#/components/responses/AcceptedOperation' } }
  /api/v1/platform/rollbacks:
    post:
      operationId: queuePlatformRollback
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha]
              properties: { sha: { type: string } }
      responses: { '202': { $ref: '#/components/responses/AcceptedOperation' } }
  /api/v1/platform/smoke:
    post:
      operationId: queuePlatformSmoke
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '202': { $ref: '#/components/responses/AcceptedOperation' } }
  /api/v1/host/assurances:
    post:
      operationId: queueHostAssurance
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '202': { $ref: '#/components/responses/AcceptedOperation' } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    AppID: { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' } }
    OperationID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    EnrollmentID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    DeviceID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    ChallengeID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    ExecSessionID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    RecoveryDrillID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    StepUpToken: { name: X-Norn-Step-Up, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 200 } }
  responses:
    Problem:
      description: Stable machine-readable error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AcceptedOperation:
      description: Durable operation accepted
      headers:
        Location: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Operation' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { $ref: '#/components/schemas/ErrorCode' }
        detail: { type: string }
        requestId: { type: string }
        error: { type: string, deprecated: true }
        eventBounds: { $ref: '#/components/schemas/EventBounds' }
    ErrorCode:
      type: string
      description: Stable machine-readable code. Clients must preserve unknown future values.
      x-extensible-enum:
        - unauthorized
        - authenticated_principal_required
        - insufficient_scope
        - invalid_request
        - invalid_app_id
        - app_not_found
        - app_discovery_failed
        - release_list_failed
        - invalid_event_cursor
        - invalid_event_filter
        - invalid_heartbeat
        - event_store_unavailable
        - event_cursor_gap
        - event_cursor_ahead
        - operation_not_found
        - operation_lookup_failed
        - operation_create_failed
        - operation_cancel_failed
        - operation_not_cancelable
        - invalid_idempotency_key
        - idempotency_key_reused
        - app_operation_active
        - postgres_not_configured
        - migration_not_configured
        - confirmation_required
        - invalid_snapshot_retention
        - invalid_snapshot_restore
        - invalid_snapshot_timestamp
        - invalid_migration_request
        - invalid_migration_ref
        - invalid_rollback_request
        - invalid_rollback_region
        - rollback_current_deployment_missing
        - rollback_target_missing
        - operation_already_finished
        - invalid_platform_ref
        - invalid_upgrade_mode
        - invalid_drain_mode
        - invalid_release_sha
        - invalid_idempotency_key
        - invalid_device_name
        - invalid_scope
        - invalid_token_note
        - token_expired
        - token_registry_unavailable
        - scope_not_requested
        - invalid_public_key
        - enrollment_failed
        - enrollment_store_unavailable
        - enrollment_list_failed
        - enrollment_not_found
        - enrollment_lookup_failed
        - enrollment_not_pending
        - enrollment_not_approved
        - invalid_enrollment_verifier
        - enrollment_already_exchanged
        - enrollment_rate_limited
        - device_not_found
        - device_not_active
        - device_lookup_failed
        - device_list_failed
        - device_revoke_failed
        - managed_token_required
        - token_not_managed
        - token_issue_failed
        - token_revoke_failed
        - managed_device_required
        - invalid_step_up_request
        - invalid_step_up_proof
        - step_up_key_required
        - step_up_failed
        - step_up_lookup_failed
        - step_up_challenge_not_found
        - step_up_challenge_inactive
        - step_up_rate_limited
        - nomad_unavailable
        - exec_step_up_required
        - step_up_already_consumed
        - invalid_exec_request
        - invalid_exec_argv
        - invalid_terminal_size
        - running_allocation_not_found
        - exec_session_create_failed
        - exec_session_not_found
        - exec_session_lookup_failed
        - exec_session_list_failed
        - exec_session_forbidden
        - exec_session_inactive
        - exec_session_not_cancelable
        - exec_session_cancel_failed
        - invalid_exec_encoding
        - exec_session_limit_reached
        - exec_session_rate_limited
        - mutation_audit_unavailable
        - mutation_audit_unsigned
        - mutation_audit_read_failed
        - production_substrate_unready
        - recovery_drills_unavailable
        - recovery_drills_read_failed
        - recovery_drill_create_failed
        - recovery_drill_not_running
        - recovery_drill_complete_failed
        - invalid_recovery_drill_kind
        - invalid_recovery_drill_target
        - invalid_recovery_drill_status
        - invalid_recovery_drill_evidence
        - invalid_limit
        - invalid_validation_request
        - validation_document_required
        - validation_document_too_large
        - invalid_fleet_plan_request
        - fleet_not_configured
        - fleet_config_invalid
        - fleet_config_read_failed
        - fleet_node_pool_not_found
        - fleet_plan_unsafe
        - fleet_plan_store_unavailable
        - fleet_plan_store_failed
        - fleet_plan_finish_failed
        - fleet_plan_read_failed
        - invalid_fleet_plan_id
        - fleet_plan_not_found
        - invalid_fleet_reconciliation
        - fleet_reconciliation_out_of_order
        - fleet_reconciliation_store_unavailable
        - fleet_reconciliation_store_failed
        - fleet_reconciliation_read_failed
        - fleet_github_not_configured
        - fleet_github_plan_stale
        - fleet_github_pull_request_failed
        - fleet_github_plan_not_ready
        - fleet_github_destructive_ack_required
        - fleet_github_dispatch_failed
        - fleet_github_receipt_failed
        - fleet_plan_invalid
        - invalid_fleet_github_dispatch
        - idempotency_key_reused
    Capabilities:
      type: object
      required: [protocolVersion, serverVersion, features, auth, endpoints]
      properties:
        protocolVersion: { type: integer }
        serverVersion: { type: string }
        features: { type: array, items: { type: string } }
        auth:
          type: object
          required: [scopes, websocketBearerHeader, websocketQueryToken]
          properties:
            scopes: { type: array, items: { type: string } }
            websocketBearerHeader: { type: boolean }
            websocketQueryToken: { type: boolean }
            deviceEnrollment: { type: boolean }
            stepUp:
              type: object
              properties:
                purposes: { type: array, items: { type: string } }
                algorithm: { const: ES256 }
                publicKeyFormat: { const: P-256-X9.63 }
                challengeTTLSeconds: { type: integer }
                header: { const: X-Norn-Step-Up }
            tokens:
              type: object
              properties:
                deviceTTLSeconds: { type: integer }
                rotation: { const: atomic }
                revocation: { const: registry }
        endpoints: { type: object, additionalProperties: { type: string } }
    HostMetrics:
      type: object
      required: [schemaVersion, observedAt, stale, samplePeriodSeconds, cpu, memory]
      properties:
        schemaVersion: { const: norn.host-metrics/v1 }
        observedAt: { type: string, format: date-time }
        stale: { type: boolean, description: True when refresh failed and the last successful sample is returned. }
        samplePeriodSeconds: { type: integer, minimum: 1 }
        cpu:
          type: object
          required: [utilizationPercent, logicalCores]
          properties:
            utilizationPercent: { type: number, minimum: 0, maximum: 100, description: Machine-wide non-idle CPU percentage reported by macOS at collection. }
            logicalCores: { type: integer, minimum: 1 }
        memory:
          type: object
          required: [totalBytes, usedBytes, availableBytes]
          properties:
            totalBytes: { type: integer, format: uint64 }
            usedBytes: { type: integer, format: uint64 }
            availableBytes: { type: integer, format: uint64 }
    ProductionReadinessReport:
      type: object
      required: [schema, generatedAt, status, summary, checks]
      properties:
        schema: { const: norn.production-readiness/v1 }
        generatedAt: { type: string, format: date-time }
        status: { type: string, enum: [ready, blocked] }
        summary:
          $ref: '#/components/schemas/ProductionReadinessSummary'
        checks:
          type: array
          items: { $ref: '#/components/schemas/ProductionReadinessCheck' }
    ProductionReadinessSummary:
      type: object
      required: [passed, warnings, failed, total]
      properties:
        passed: { type: integer, minimum: 0 }
        warnings: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    ProductionReadinessCheck:
      type: object
      required: [id, category, status, title, detail]
      properties:
        id: { type: string }
        category: { type: string }
        status: { type: string, enum: [pass, warn, fail] }
        title: { type: string }
        detail: { type: string }
        remediation: { type: string }
        evidence: { type: object, additionalProperties: true }
    MutationAuditList:
      type: object
      required: [schema, events, count]
      properties:
        schema: { const: norn.mutation-audit/v1 }
        count: { type: integer, minimum: 0 }
        events: { type: array, items: { $ref: '#/components/schemas/MutationAuditEvent' } }
    MutationAuditEvent:
      type: object
      required: [id, principalSubject, method, path, status, outcome, startedAt, durationMs, integrity]
      properties:
        id: { type: string, format: uuid }
        requestId: { type: string }
        principalSubject: { type: string }
        tokenId: { type: string }
        deviceId: { type: string, format: uuid }
        keyId: { type: string, pattern: '^[a-f0-9]{16}$' }
        scopes: { type: array, items: { type: string } }
        method: { type: string }
        path: { type: string }
        clientIp: { type: string }
        userAgent: { type: string }
        status: { type: integer }
        outcome: { type: string, enum: [started, succeeded, rejected, failed, crashed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        durationMs: { type: integer, format: int64, minimum: 0 }
        integrity: { type: string, enum: [pending, unsigned, verified, invalid, acknowledged-invalid] }
        incident: { $ref: '#/components/schemas/MutationAuditIncident' }
    MutationAuditIncidentRequest:
      type: object
      required: [reasonCode, explanation]
      additionalProperties: false
      properties:
        reasonCode:
          type: string
          enum: [legacy_timestamp_precision, legacy_signing_compatibility, signing_key_loss, storage_corruption, other]
        explanation: { type: string, minLength: 12, maxLength: 1024 }
    MutationAuditIncident:
      type: object
      required: [id, auditEventId, reasonCode, explanation, acknowledgedBy, acknowledgedAt, integrity]
      properties:
        id: { type: string, format: uuid }
        auditEventId: { type: string, format: uuid }
        reasonCode:
          type: string
          enum: [legacy_timestamp_precision, legacy_signing_compatibility, signing_key_loss, storage_corruption, other]
        explanation: { type: string }
        acknowledgedBy: { type: string }
        acknowledgedAt: { type: string, format: date-time }
        keyId: { type: string, pattern: '^[a-f0-9]{16}$' }
        integrity: { type: string, enum: [unsigned, verified, invalid] }
    RecoveryDrillList:
      type: object
      required: [schema, requiredKinds, drills, count]
      properties:
        schema: { const: norn.recovery-drills/v1 }
        requiredKinds: { type: array, items: { $ref: '#/components/schemas/RecoveryDrillKind' } }
        drills: { type: array, items: { $ref: '#/components/schemas/RecoveryDrill' } }
        count: { type: integer, minimum: 0 }
    RecoveryDrillKind:
      type: string
      enum: [artifact.rollback, database.restore, node.failover, region.failover, control.restore]
    RecoveryDrill:
      type: object
      required: [id, kind, status, initiatedBy, startedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/RecoveryDrillKind' }
        target: { type: string, maxLength: 256 }
        status: { type: string, enum: [running, passed, failed] }
        initiatedBy: { type: string }
        evidence: { type: object, additionalProperties: { type: string, maxLength: 1024 }, maxProperties: 20 }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    RecoveryDrillStartRequest:
      type: object
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/RecoveryDrillKind' }
        target: { type: string, maxLength: 256 }
    RecoveryDrillCompleteRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [passed, failed] }
        evidence: { type: object, additionalProperties: { type: string, maxLength: 1024 }, maxProperties: 20 }
    EnrollmentStartRequest:
      type: object
      required: [deviceName]
      properties:
        deviceName: { type: string, maxLength: 120 }
        platform: { type: string, maxLength: 80 }
        model: { type: string, maxLength: 120 }
        appVersion: { type: string, maxLength: 80 }
        publicKey: { type: string, maxLength: 128, description: Base64url P-256 X9.63 public key used for proof-of-possession step-up. }
        requestedScopes: { type: array, items: { type: string } }
    EnrollmentStartResponse:
      type: object
      required: [id, userCode, verifier, expiresAt, verificationPath, pollPath]
      properties:
        id: { type: string, format: uuid }
        userCode: { type: string, pattern: '^[A-Z2-9]{4}-[A-Z2-9]{4}$' }
        verifier: { type: string }
        expiresAt: { type: string, format: date-time }
        verificationPath: { type: string }
        pollPath: { type: string }
    Enrollment:
      type: object
      required: [id, deviceName, requestedScopes, status, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        deviceName: { type: string }
        platform: { type: string }
        model: { type: string }
        appVersion: { type: string }
        requestedScopes: { type: array, items: { type: string } }
        approvedScopes: { type: array, items: { type: string } }
        status: { type: string, enum: [pending, approved, exchanged, expired, locked] }
        deviceId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time }
        exchangedAt: { type: string, format: date-time }
    AccessTokenMetadata:
      type: object
      required: [id, scopes, issuedAt, expiresAt]
      properties:
        id: { type: string }
        deviceId: { type: string, format: uuid }
        subject: { type: string }
        scopes: { type: array, items: { type: string } }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        rotatedFrom: { type: string }
    IssuedToken:
      type: object
      required: [token, tokenId, deviceId, scopes, expiresAt]
      properties:
        token: { type: string, writeOnly: true }
        tokenId: { type: string }
        deviceId: { type: string, format: uuid }
        scopes: { type: array, items: { type: string } }
        expiresAt: { type: string, format: date-time }
    Device:
      type: object
      required: [id, name, createdAt, tokens]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        platform: { type: string }
        model: { type: string }
        appVersion: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        tokens: { type: array, items: { $ref: '#/components/schemas/AccessTokenMetadata' } }
    StepUpChallenge:
      type: object
      required: [id, purpose, resource, nonce, signaturePayload, expiresAt]
      properties:
        id: { type: string, format: uuid }
        purpose: { const: exec }
        resource: { type: string }
        nonce: { type: string }
        signaturePayload: { type: string }
        expiresAt: { type: string, format: date-time }
    StepUpAuthorization:
      type: object
      required: [stepUpToken, purpose, resource, challengeId, expiresAt]
      properties:
        stepUpToken: { type: string, writeOnly: true }
        purpose: { const: exec }
        resource: { type: string }
        challengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
    ExecSessionRequest:
      type: object
      properties:
        allocationId: { type: string }
        process: { type: string }
        argv: { type: array, maxItems: 128, items: { type: string, maxLength: 8192 }, default: [/bin/sh] }
        terminal: { type: boolean, default: true }
        columns: { type: integer, minimum: 1, maximum: 1000, default: 80 }
        rows: { type: integer, minimum: 1, maximum: 1000, default: 24 }
    ExecSessionCreated:
      type: object
      required: [session, protocol, streamPath]
      properties:
        session: { $ref: '#/components/schemas/ExecSession' }
        protocol: { const: norn.exec/v1 }
        streamPath: { type: string }
    ExecSession:
      type: object
      required: [id, deviceId, tokenId, challengeId, appId, allocationId, task, commandDigest, terminal, columns, rows, status, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        tokenId: { type: string }
        challengeId: { type: string, format: uuid }
        appId: { type: string }
        allocationId: { type: string }
        task: { type: string }
        commandDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
        terminal: { type: boolean }
        columns: { type: integer }
        rows: { type: integer }
        status: { type: string, enum: [pending, running, completed, failed, canceled, expired] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        connectedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        exitCode: { type: integer }
        errorCode: { type: string }
        remoteAddress: { type: string }
        userAgent: { type: string }
    ExecInputFrame:
      type: object
      required: [frame, sequence, data]
      properties:
        frame: { const: input }
        sequence: { type: integer, format: int64, minimum: 1 }
        data: { type: string }
        encoding: { type: string, enum: [utf8, base64], default: utf8 }
    ExecResizeFrame:
      type: object
      required: [frame, sequence, columns, rows]
      properties:
        frame: { const: resize }
        sequence: { type: integer, format: int64, minimum: 1 }
        columns: { type: integer, minimum: 1 }
        rows: { type: integer, minimum: 1 }
    ExecCloseInputFrame:
      type: object
      required: [frame, sequence]
      properties:
        frame: { const: close-input }
        sequence: { type: integer, format: int64, minimum: 1 }
    ExecReadyFrame:
      type: object
      required: [frame, sequence, timestamp, protocol, terminal, columns, rows]
      properties:
        frame: { const: ready }
        sequence: { type: integer, format: int64 }
        timestamp: { type: string, format: date-time }
        protocol: { const: norn.exec/v1 }
        terminal: { type: boolean }
        columns: { type: integer }
        rows: { type: integer }
    ExecOutputFrame:
      type: object
      required: [frame, sequence, timestamp, data, encoding]
      properties:
        frame: { type: string, enum: [stdout, stderr] }
        sequence: { type: integer, format: int64 }
        timestamp: { type: string, format: date-time }
        data: { type: string }
        encoding: { type: string, enum: [utf8, base64] }
    ExecErrorFrame:
      type: object
      required: [frame, sequence, timestamp, code, detail]
      properties:
        frame: { const: error }
        sequence: { type: integer, format: int64 }
        timestamp: { type: string, format: date-time }
        code: { type: string }
        detail: { type: string }
    ExecExitFrame:
      type: object
      required: [frame, sequence, timestamp, exitCode, reason]
      properties:
        frame: { const: exit }
        sequence: { type: integer, format: int64 }
        timestamp: { type: string, format: date-time }
        exitCode: { type: integer }
        reason: { type: string, enum: [exited, transport-error, expired] }
    AppStatus:
      type: object
      required: [spec, healthy, allocations, allocationSummary]
      properties:
        spec:
          type: object
          required: [name, processes]
          properties:
            name: { type: string }
            deploy: { type: boolean, default: false }
            primaryRegion: { type: string }
            regions:
              type: object
              additionalProperties: { $ref: '#/components/schemas/RegionTarget' }
            placement:
              type: object
              additionalProperties: false
              required: [nodePool]
              properties:
                nodePool: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' }
            repo: { type: object, additionalProperties: true }
            processes: { type: object, additionalProperties: true }
            endpoints: { type: array, items: { type: object, additionalProperties: true } }
        nomadStatus: { type: string }
        healthy: { type: boolean }
        allocations: { type: array, items: { type: object, additionalProperties: true } }
        allocationSummary: { type: object, additionalProperties: true }
    CreateAppRequest:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' }
        kind: { type: string, enum: [endpoint, worker] }
        port: { type: integer, minimum: 1, maximum: 65535, default: 8080 }
    AppMutationReceipt:
      type: object
      required: [app, spec]
      properties:
        app: { type: string }
        created: { type: boolean }
        spec: { type: object, additionalProperties: true }
    DocumentValidationRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document: { type: string, maxLength: 65536 }
        fleetDocument: { type: string, maxLength: 65536, description: Optional norn.dev/fleet/v1 context for InfraSpec node-pool cross-validation. }
    ValidationFinding:
      type: object
      required: [severity, code, field, message]
      properties:
        severity: { type: string, enum: [error, warning, info] }
        code: { type: string }
        field: { type: string }
        message: { type: string }
        remediation: { type: string }
    InfraSpecValidationReport:
      type: object
      required: [schemaVersion, documentKind, valid, findings]
      properties:
        schemaVersion: { const: norn.validation-report/v1 }
        documentKind: { const: infraspec }
        app: { type: string }
        valid: { type: boolean }
        findings: { type: array, items: { $ref: '#/components/schemas/ValidationFinding' } }
    FleetValidationReport:
      type: object
      required: [schemaVersion, documentKind, valid, findings]
      properties:
        schemaVersion: { const: norn.validation-report/v1 }
        documentKind: { const: fleet }
        name: { type: string }
        valid: { type: boolean }
        findings: { type: array, items: { $ref: '#/components/schemas/ValidationFinding' } }
    FleetMetadata:
      type: object
      additionalProperties: false
      properties:
        repository: { type: string }
        environment: { type: string }
        workflowUrl: { type: string, format: uri }
    FleetCluster:
      type: object
      additionalProperties: false
      required: [name, provider, region]
      properties:
        name: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' }
        provider: { type: string }
        region: { type: string }
    FleetReplacementPolicy:
      type: object
      additionalProperties: false
      properties:
        strategy: { type: string, enum: [blueGreen, rolling], default: blueGreen }
        requireCapacityHeadroom: { type: boolean }
        drainTimeout: { type: string }
        requireReadiness: { type: boolean }
    FleetNodePool:
      type: object
      additionalProperties: false
      required: [size, min, desired, max]
      properties:
        size: { type: string }
        min: { type: integer, minimum: 0 }
        desired: { type: integer, minimum: 0 }
        max: { type: integer, minimum: 1 }
        labels: { type: object, additionalProperties: { type: string } }
        replacement: { $ref: '#/components/schemas/FleetReplacementPolicy' }
    FleetDocument:
      type: object
      additionalProperties: false
      required: [apiVersion, kind, cluster, nodePools]
      properties:
        apiVersion: { const: norn.dev/fleet/v1 }
        kind: { const: Cluster }
        metadata: { $ref: '#/components/schemas/FleetMetadata' }
        cluster: { $ref: '#/components/schemas/FleetCluster' }
        nodePools:
          type: object
          additionalProperties: { $ref: '#/components/schemas/FleetNodePool' }
    FleetInventory:
      type: object
      required: [schemaVersion, configured, nodePools]
      properties:
        schemaVersion: { const: norn.fleet-inventory/v1 }
        configured: { type: boolean }
        source: { type: string }
        digest: { type: string }
        document: { $ref: '#/components/schemas/FleetDocument' }
        validation: { $ref: '#/components/schemas/FleetValidationReport' }
        nodePools:
          type: object
          additionalProperties: { $ref: '#/components/schemas/FleetNodePool' }
    FleetGitHubStatus:
      type: object
      additionalProperties: false
      required: [schemaVersion, configured, connected]
      properties:
        schemaVersion: { const: norn.fleet-github-status/v1 }
        configured: { type: boolean }
        connected: { type: boolean }
        repository: { type: string }
        installationId: { type: integer, format: int64 }
        defaultBranch: { type: string }
        configPath: { type: string }
        planWorkflow: { type: string }
        applyWorkflow: { type: string }
        message: { type: string }
    FleetGitHubDispatchRequest:
      type: object
      additionalProperties: false
      required: [allowDestructive]
      properties:
        allowDestructive: { type: boolean }
    FleetCapacityPlanRequest:
      type: object
      additionalProperties: false
      properties:
        desired: { type: integer, minimum: 0 }
        size: { type: string }
        strategy: { type: string, enum: [blueGreen, rolling] }
        reason: { type: string, maxLength: 1000 }
    FleetReconciliationRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, phase, status, commitSha, planSha256, evidenceDigest]
      properties:
        schemaVersion: { const: norn.fleet-reconciliation/v1 }
        phase:
          type: string
          enum: [infrastructure_applied, inventory_generated, nodes_configured, nodes_enrolled, readiness_verified, old_nodes_drained, complete]
        status: { type: string, enum: [succeeded, failed] }
        commitSha: { type: string, pattern: '^[0-9a-f]{40}$' }
        planSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        stateSerial: { type: integer, format: int64, minimum: 0 }
        evidenceDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        message: { type: string, maxLength: 1000 }
    RegionTarget:
      type: object
      properties:
        nomadRegion: { type: string }
        datacenters: { type: array, items: { type: string } }
        trafficWeight: { type: integer, minimum: 0, maximum: 100, default: 100 }
    Release:
      type: object
      required: [sha, version, createdAt, path, current]
      properties:
        sha: { type: string }
        version: { type: string }
        createdAt: { type: string, format: date-time }
        path: { type: string }
        current: { type: boolean }
    ReleaseList:
      type: object
      required: [releases]
      properties:
        current: { type: string }
        releases: { type: array, items: { $ref: '#/components/schemas/Release' } }
    HostStatus:
      type: object
      required: [schemaVersion, status, services, observedAt]
      properties:
        schemaVersion: { const: norn.host-status/v1 }
        status: { type: string, enum: [ok, degraded] }
        services: { type: object, additionalProperties: { type: string } }
        latestAssurance: { $ref: '#/components/schemas/Operation' }
        observedAt: { type: string, format: date-time }
    EventBounds:
      type: object
      required: [oldestCursor, latestCursor, retainedEvents]
      properties:
        oldestCursor: { type: integer, format: int64 }
        latestCursor: { type: integer, format: int64 }
        retainedEvents: { type: integer, format: int64 }
        oldestTimestamp: { type: string, format: date-time }
        latestTimestamp: { type: string, format: date-time }
    EventStreamInfo:
      type: object
      required: [protocolVersion, bounds, retentionPolicy, retention, gapDetection, heartbeatMinimumSeconds, heartbeatMaximumSeconds, filters]
      properties:
        protocolVersion: { type: integer }
        bounds: { $ref: '#/components/schemas/EventBounds' }
        retentionPolicy: { type: string }
        retention:
          type: object
          required: [mode, automaticPruning, replayPageSize]
          properties:
            mode: { type: string, enum: [unbounded] }
            automaticPruning: { type: boolean }
            replayPageSize: { type: integer }
        gapDetection: { type: boolean }
        heartbeatMinimumSeconds: { type: integer }
        heartbeatMaximumSeconds: { type: integer }
        filters: { type: array, items: { type: string } }
    Event:
      type: object
      required: [id, timestamp, type, payload]
      properties:
        id: { type: integer, format: int64 }
        timestamp: { type: string, format: date-time }
        type: { type: string }
        appId: { type: string }
        payload: {}
    HeartbeatFrame:
      type: object
      required: [frame, timestamp]
      properties:
        frame: { const: heartbeat }
        timestamp: { type: string, format: date-time }
    Operation:
      type: object
      required: [id, kind, status, startedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        app: { type: string }
        sagaId: { type: string }
        ref: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, canceled] }
        risk: { type: string }
        source: { type: string }
        message: { type: string }
        payload: { type: object, additionalProperties: true }
        metadata: { type: object, additionalProperties: true }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        lockedBy: { type: string }
        lockedUntil: { type: string, format: date-time }
        nextAttemptAt: { type: string, format: date-time }
        lastError: { type: string }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        receipt: { $ref: '#/components/schemas/OperationReceipt' }
    OperationReceipt:
      type: object
      required: [schemaVersion, kind, outcome, summary, startedAt]
      properties:
        schemaVersion: { const: norn.operation-receipt/v1 }
        kind: { type: string }
        outcome: { type: string, enum: [succeeded, failed, canceled] }
        summary: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        platform: { $ref: '#/components/schemas/PlatformOperationReceipt' }
        host: { $ref: '#/components/schemas/HostAssuranceReceipt' }
        app: { $ref: '#/components/schemas/AppOperationReceipt' }
        fleet: { $ref: '#/components/schemas/FleetOperationReceipt' }
    PlatformOperationReceipt:
      type: object
      properties:
        ref: { type: string }
        sha: { type: string }
        mode: { type: string, enum: [restart, proxy] }
        drainMode: { type: string, enum: [fail, wait, force] }
        exitCode: { type: integer }
        output: { type: string }
        outputTruncated: { type: boolean }
    HostAssuranceReceipt:
      type: object
      properties:
        exitCode: { type: integer }
        output: { type: string }
        outputTruncated: { type: boolean }
    AppOperationReceipt:
      type: object
      required: [app]
      properties:
        app: { type: string }
        ref: { type: string }
        deploymentId: { type: string }
        commitSha: { type: string }
        imageTag: { type: string }
        step: { type: string }
        snapshot: { type: string }
        preRestoreSnapshot: { type: string }
        database: { type: string }
        keep: { type: integer }
        pruned: { type: array, items: { type: string } }
    AppSnapshot:
      type: object
      required: [filename, database, timestamp, size]
      properties:
        filename: { type: string }
        database: { type: string }
        commitSha: { type: string }
        timestamp: { type: string, pattern: '^[0-9]{8}T[0-9]{6}$' }
        createdAt: { type: string, format: date-time }
        size: { type: integer, format: int64, minimum: 0 }
    FleetOperationReceipt:
      type: object
      required: [planId]
      properties:
        planId: { type: string, format: uuid }
        cluster: { type: string }
        pool: { type: string }
        action: { type: string, enum: [scale, replace, reconcile] }
        sourceDigest: { type: string }
        planDigest: { type: string }
        signature: { type: string }
        workflowUrl: { type: string, format: uri }
        phase: { type: string }
        commitSha: { type: string }
        planSha256: { type: string }
        stateSerial: { type: integer, format: int64 }
        evidenceDigest: { type: string }
    PlatformRefRequest:
      type: object
      properties: { ref: { type: string, default: HEAD } }
    PlatformUpgradeRequest:
      type: object
      required: [ref]
      properties:
        ref: { type: string }
        mode: { type: string, enum: [restart, proxy], default: restart }
        drainMode: { type: string, enum: [fail, wait, force], default: fail }
