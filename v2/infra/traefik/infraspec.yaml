name: norn-traefik
deploy: false
processes:
  web:
    port: 8080
    hostPort: 18080
    command: >-
      traefik
      --entrypoints.web.address=:8080
      --ping=true
      --ping.entrypoint=web
      --providers.consulcatalog=true
      --providers.consulcatalog.endpoint.address=$CONSUL_HTTP_ADDR
      --providers.consulcatalog.exposedbydefault=false
      --providers.consulcatalog.prefix=traefik
      --metrics.prometheus=true
      --metrics.prometheus.entrypoint=web
    health:
      path: /ping
      interval: 10s
      timeout: 3s
    metrics:
      enabled: true
      path: /metrics
    scaling:
      min: 1
      max: 1
    resources:
      cpu: 100
      memory: 128
    env:
      CONSUL_HTTP_ADDR: http://host.docker.internal:8500
build:
  image: traefik:v3.5
