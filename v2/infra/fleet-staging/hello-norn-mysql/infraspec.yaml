name: hello-norn-mysql-managed
nomadNamespace: norn-work-staging
deploy: false
# The repository release caller also requires the explicit
# NORN_MANAGED_MYSQL_STAGING_RELEASE_ENABLED repository variable. Enable it
# only after this catalog entry has a reviewed route and protected inputs.
repo:
  # The serving direct pilot's source is in this repository. Release admission
  # still binds an exact CI source SHA to the image being deployed.
  url: https://github.com/antiartificial/norn.git
  branch: master
  repoWeb: https://github.com/antiartificial/norn
build:
  dockerfile: v2/infra/fleet-pilot/hello-norn-mysql/Dockerfile
  # Exact digest from the currently serving direct pilot. A later CI release
  # must still bind its own exact source and artifact before promotion.
  image: ghcr.io/antiartificial/hello-norn-mysql@sha256:1f6da72837522c1507e1aa965d6cf31f452fa46ad6791f3b62197b15905e930f
  test: go test ./...
# Separate managed candidate. Its Consul service and router names cannot mix
# with the live direct-Nomad pilot. Deployment remains disabled pending catalog,
# credential, release binding and runtime qualification.
env:
  MYSQL_DSN_FILE: "${NOMAD_SECRETS_DIR}/mysql-dsn"
  MYSQL_CA_FILE: "${NOMAD_SECRETS_DIR}/mysql-ca.pem"
  MYSQL_PINNED_IP_FILE: "${NOMAD_SECRETS_DIR}/mysql-pinned-ip"
  PILOT_WRITE_TOKEN_FILE: "${NOMAD_SECRETS_DIR}/pilot-write-token"
placement:
  nodePool: app
  distinctHosts: true
regions:
  nyc3:
    nomadRegion: global
    datacenters: [nyc3]
primaryRegion: nyc3
processes:
  web:
    port: 8080
    # Use the image's immutable ENTRYPOINT. The Norn translator treats a
    # command as a shell snippet, which would make the image depend on a shell.
    health:
      path: /readyz
      interval: 5s
      timeout: 3s
    liveness:
      path: /healthz
      interval: 10s
      timeout: 3s
      restartLimit: 3
      restartGrace: 30s
    rollout:
      minHealthyTime: 15s
      healthyDeadline: 3m
      progressDeadline: 10m
    shutdownDelay: 10s
    metrics:
      enabled: true
      path: /metrics
    scaling:
      min: 2
      max: 4
    resources:
      cpu: 200
      memory: 128
    drain:
      # The image declares STOPSIGNAL SIGTERM. Leaving signal unset makes the
      # Nomad Docker driver use its idempotent stop path after a hard reboot,
      # including when Docker has already restored the container as stopped.
      timeout: 20s
    # Nomad derives nomad/jobs/hello-norn-mysql-managed from this service job ID; the
    # source path is not configurable in InfraSpec. Every value is rendered as
    # a 0400 allocation file owned by the image's non-root runtime user.
    nomadVariables:
      uid: 65532
      gid: 65532
      files:
        - key: MYSQL_DSN
          destination: mysql-dsn
        - key: MYSQL_CA_PEM
          destination: mysql-ca.pem
        - key: MYSQL_PINNED_IP
          destination: mysql-pinned-ip
        - key: PILOT_WRITE_TOKEN
          destination: pilot-write-token
endpoints:
  # Catalog promotion replaces this non-routable placeholder with the reviewed
  # Access-protected staging origin before deployment can be enabled.
  - url: https://work-staging-hello-norn-mysql.invalid
    region: nyc3
    process: web
    restrictedIngress:
      publicPaths: [/records/, /version, /route-proof]
      retryGETPaths: [/records/, /version]
      privateReadinessPath: /readyz
    trafficProbe:
      path: /route-proof
      bodySHA256: c2f21436748914ff673d5bb71c7e5fb50bcc64eced18dae230eface10d65b1cc
# Run migrate separately with the migration identity; the web identity should
# have SELECT/INSERT/UPDATE only.
