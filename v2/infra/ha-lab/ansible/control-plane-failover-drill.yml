---
- name: Prove Consul and Nomad leader failover under TLS and ACL enforcement
  hosts: norn_ha[0]
  become: true
  gather_facts: false
  any_errors_fatal: true
  environment: "{{ control_environment }}"
  vars:
    drill_workload_service: "{{ 'norn-durability-pilot-web' if durability_pilot_enabled else 'norn-ha-toy-web' }}"
    drill_workload_job: "{{ 'norn-durability-pilot' if durability_pilot_enabled else 'norn-ha-toy' }}"
    drill_workload_group: web
    drill_workload_allocations: 2
  tasks:
    - name: Guard against fault injection outside the disposable lab
      ansible.builtin.stat:
        path: /etc/norn-ha-lab
      register: lab_guard

    - name: Require the disposable-lab marker
      ansible.builtin.assert:
        that: lab_guard.stat.exists
        fail_msg: "Refusing control-plane fault injection outside a managed Norn HA lab."

    - name: Read the current Consul leader
      ansible.builtin.shell: "set -o pipefail && consul operator raft list-peers | awk '$4 == \"leader\" {print $1}'"
      args:
        executable: /bin/bash
      register: consul_leader_before
      changed_when: false

    - name: Select a Consul survivor
      ansible.builtin.set_fact:
        old_consul_leader: "{{ consul_leader_before.stdout | trim }}"
        consul_survivor: "{{ groups['norn_ha'] | reject('equalto', consul_leader_before.stdout | trim) | first }}"

    - name: Require a known Consul leader
      ansible.builtin.assert:
        that: old_consul_leader in groups['norn_ha']
        fail_msg: "Consul did not report an inventory member as leader."

    - name: Stop the elected Consul leader
      ansible.builtin.systemd_service:
        name: consul
        state: stopped
      delegate_to: "{{ old_consul_leader }}"

    - name: Exercise the surviving Consul quorum with unconditional cleanup
      block:
        - name: Wait for a different Consul leader
          ansible.builtin.shell: "set -o pipefail && consul operator raft list-peers | awk '$4 == \"leader\" {print $1}'"
          args:
            executable: /bin/bash
          delegate_to: "{{ consul_survivor }}"
          register: consul_leader_during
          changed_when: false
          retries: 30
          delay: 2
          until:
            - consul_leader_during.stdout | trim | length > 0
            - consul_leader_during.stdout | trim != old_consul_leader

        - name: Require catalog reads through the surviving Consul quorum
          ansible.builtin.command: consul catalog services
          delegate_to: "{{ consul_survivor }}"
          register: consul_catalog_during
          changed_when: false

        - name: Require the active workload and Norn services during Consul failover
          ansible.builtin.assert:
            that:
              - "drill_workload_service in consul_catalog_during.stdout_lines"
              - "'norn-api' in consul_catalog_during.stdout_lines"

        - name: Require exactly one passing Norn API during Consul failover
          ansible.builtin.uri:
            url: http://127.0.0.1:8500/v1/health/service/norn-api?passing=true
            return_content: true
          delegate_to: "{{ consul_survivor }}"
          register: norn_during_consul_failover
          retries: 60
          delay: 2
          until: norn_during_consul_failover.json | length == 1
      always:
        - name: Always rejoin the former Consul leader
          ansible.builtin.systemd_service:
            name: consul
            enabled: true
            state: started
          delegate_to: "{{ old_consul_leader }}"

    - name: Wait for all Consul members after rejoin
      ansible.builtin.shell: "set -o pipefail && consul members -status=alive | tail -n +2 | wc -l"
      args:
        executable: /bin/bash
      delegate_to: "{{ consul_survivor }}"
      register: consul_members_after
      changed_when: false
      retries: 30
      delay: 2
      until: consul_members_after.stdout | int == groups['norn_ha'] | length

    - name: Read the current Nomad leader
      ansible.builtin.shell: "set -o pipefail && nomad operator raft list-peers -no-color | awk '$4 == \"leader\" {print $1}'"
      args:
        executable: /bin/bash
      register: nomad_leader_before
      changed_when: false

    - name: Select a Nomad survivor
      ansible.builtin.set_fact:
        old_nomad_leader: "{{ nomad_leader_before.stdout | trim | regex_replace('\\.global$', '') }}"
        nomad_survivor: "{{ groups['norn_ha'] | reject('equalto', nomad_leader_before.stdout | trim | regex_replace('\\.global$', '')) | first }}"

    - name: Require a known Nomad leader
      ansible.builtin.assert:
        that: old_nomad_leader in groups['norn_ha']
        fail_msg: "Nomad did not report an inventory member as leader."

    - name: Stop the elected Nomad leader
      ansible.builtin.systemd_service:
        name: nomad
        state: stopped
      delegate_to: "{{ old_nomad_leader }}"

    - name: Exercise the surviving Nomad quorum with unconditional cleanup
      block:
        - name: Wait for a different Nomad leader
          ansible.builtin.shell: "set -o pipefail && nomad operator raft list-peers -no-color | awk '$4 == \"leader\" {sub(/\\.global$/, \"\", $1); print $1}'"
          args:
            executable: /bin/bash
          delegate_to: "{{ nomad_survivor }}"
          register: nomad_leader_during
          changed_when: false
          retries: 30
          delay: 2
          until:
            - nomad_leader_during.stdout | trim | length > 0
            - nomad_leader_during.stdout | trim != old_nomad_leader

        - name: Require the workload allocations during Nomad failover
          ansible.builtin.shell: >-
            set -o pipefail &&
            nomad job status -json {{ drill_workload_job | quote }} |
            jq -r --arg group {{ drill_workload_group | quote }} '.[0].Summary.Summary[$group].Running'
          args:
            executable: /bin/bash
          delegate_to: "{{ nomad_survivor }}"
          register: toy_allocations_during
          changed_when: false
          retries: 30
          delay: 2
          until: toy_allocations_during.stdout | int == drill_workload_allocations
      always:
        - name: Always rejoin the former Nomad leader
          ansible.builtin.systemd_service:
            name: nomad
            enabled: true
            state: started
          delegate_to: "{{ old_nomad_leader }}"

    - name: Wait for all Nomad peers after rejoin
      ansible.builtin.shell: "set -o pipefail && nomad operator raft list-peers -no-color | tail -n +2 | awk 'NF > 0' | wc -l"
      args:
        executable: /bin/bash
      delegate_to: "{{ nomad_survivor }}"
      register: nomad_peers_after
      changed_when: false
      retries: 30
      delay: 2
      until: nomad_peers_after.stdout | int == groups['norn_ha'] | length

    - name: Emit value-safe control-plane failover evidence
      ansible.builtin.debug:
        msg:
          schema: norn.ha-drill/v1
          kind: control-plane-failover
          consul_leader_before: "{{ old_consul_leader }}"
          consul_leader_after: "{{ consul_leader_during.stdout | trim }}"
          nomad_leader_before: "{{ old_nomad_leader }}"
          nomad_leader_after: "{{ nomad_leader_during.stdout | trim }}"
          consul_members: "{{ groups['norn_ha'] | length }}"
          nomad_peers: "{{ groups['norn_ha'] | length }}"
          workload: "{{ drill_workload_job }}"
          workload_allocations: "{{ drill_workload_allocations }}"
