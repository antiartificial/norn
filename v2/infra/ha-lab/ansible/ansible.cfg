[defaults]
inventory = ../scripts/inventory
host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
stdout_callback = default
timeout = 20

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o StrictHostKeyChecking=accept-new
