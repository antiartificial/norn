---
lab_cluster_name: norn-ha-lab
consul_package_version: "2.0.3-1"
nomad_package_version: "2.0.5-1"
postgresql_major_version: 16
postgresql_package_version: "16+257build1.1"
patroni_package_version: "3.2.2-2"

consul_gossip_key: "{{ lookup('ansible.builtin.env', 'NORN_HA_CONSUL_GOSSIP_KEY') }}"
nomad_gossip_key: "{{ lookup('ansible.builtin.env', 'NORN_HA_NOMAD_GOSSIP_KEY') }}"
postgres_superuser_password: "{{ lookup('ansible.builtin.env', 'NORN_HA_POSTGRES_PASSWORD') }}"
postgres_replication_password: "{{ lookup('ansible.builtin.env', 'NORN_HA_REPLICATION_PASSWORD') }}"
postgres_rewind_password: "{{ lookup('ansible.builtin.env', 'NORN_HA_REWIND_PASSWORD') }}"
norn_database_password: "{{ lookup('ansible.builtin.env', 'NORN_HA_NORN_DB_PASSWORD') }}"
durability_database_password: "{{ lookup('ansible.builtin.env', 'NORN_HA_DURABILITY_DB_PASSWORD') }}"
norn_api_token: "{{ lookup('ansible.builtin.env', 'NORN_HA_NORN_API_TOKEN') }}"
norn_audit_signing_key: "{{ lookup('ansible.builtin.env', 'NORN_HA_AUDIT_SIGNING_KEY') }}"
grafana_admin_password: "{{ lookup('ansible.builtin.env', 'NORN_HA_GRAFANA_ADMIN_PASSWORD') }}"
cosign_public_key_path: "{{ lookup('ansible.builtin.env', 'NORN_HA_COSIGN_PUBLIC_KEY_PATH') }}"
git_deploy_key_path: "{{ lookup('ansible.builtin.env', 'NORN_HA_GIT_DEPLOY_KEY_PATH') }}"
age_key_path: "{{ lookup('ansible.builtin.env', 'NORN_HA_AGE_KEY_PATH') }}"
age_recipient: "{{ lookup('ansible.builtin.env', 'NORN_HA_AGE_RECIPIENT') }}"
toy_secrets_path: "{{ lookup('ansible.builtin.env', 'NORN_HA_TOY_SECRETS_PATH') }}"
durability_pilot_enabled: "{{ lookup('ansible.builtin.env', 'NORN_HA_ENABLE_DURABILITY_PILOT') | default('false', true) | bool }}"
durability_pilot_secrets_path: "{{ lookup('ansible.builtin.env', 'NORN_HA_DURABILITY_SECRETS_PATH') }}"
durability_pilot_infraspec_path: "{{ lookup('ansible.builtin.env', 'NORN_HA_DURABILITY_INFRASPEC_PATH') }}"
pki_dir: "{{ lookup('ansible.builtin.env', 'NORN_HA_PKI_DIR') }}"
registry_config_path: "{{ lookup('ansible.builtin.env', 'NORN_HA_REGISTRY_CONFIG_PATH') }}"
backup_bucket: "{{ lookup('ansible.builtin.env', 'NORN_HA_BACKUP_BUCKET') }}"
backup_region: "{{ lookup('ansible.builtin.env', 'NORN_HA_BACKUP_REGION') }}"
backup_endpoint: "{{ lookup('ansible.builtin.env', 'NORN_HA_BACKUP_ENDPOINT') }}"
backup_access_key: "{{ lookup('ansible.builtin.env', 'NORN_HA_BACKUP_ACCESS_KEY') }}"
backup_secret_key: "{{ lookup('ansible.builtin.env', 'NORN_HA_BACKUP_SECRET_KEY') }}"
security_phase: "{{ lookup('ansible.builtin.env', 'NORN_HA_SECURITY_PHASE') | default('disabled', true) }}"
norn_profile: "{{ lookup('ansible.builtin.env', 'NORN_HA_NORN_PROFILE') | default('development', true) }}"
consul_management_token: "{{ lookup('ansible.builtin.env', 'NORN_HA_CONSUL_MANAGEMENT_TOKEN') }}"
consul_norn_token: "{{ lookup('ansible.builtin.env', 'NORN_HA_CONSUL_NORN_TOKEN') }}"
consul_patroni_token: "{{ lookup('ansible.builtin.env', 'NORN_HA_CONSUL_PATRONI_TOKEN') }}"
consul_nomad_token: "{{ lookup('ansible.builtin.env', 'NORN_HA_CONSUL_NOMAD_TOKEN') }}"
consul_observability_token: "{{ lookup('ansible.builtin.env', 'NORN_HA_CONSUL_OBSERVABILITY_TOKEN') }}"
consul_agent_token: "{{ lookup('ansible.builtin.env', 'NORN_HA_CONSUL_AGENT_TOKEN_' ~ inventory_hostname[-2:]) }}"
nomad_management_token: "{{ lookup('ansible.builtin.env', 'NORN_HA_NOMAD_MANAGEMENT_TOKEN') }}"
nomad_norn_accessor: "{{ lookup('ansible.builtin.env', 'NORN_HA_NOMAD_NORN_ACCESSOR') }}"
nomad_norn_token: "{{ lookup('ansible.builtin.env', 'NORN_HA_NOMAD_NORN_TOKEN') }}"
nomad_observability_accessor: "{{ lookup('ansible.builtin.env', 'NORN_HA_NOMAD_OBSERVABILITY_ACCESSOR') }}"
nomad_observability_token: "{{ lookup('ansible.builtin.env', 'NORN_HA_NOMAD_OBSERVABILITY_TOKEN') }}"
control_environment:
  CONSUL_HTTP_ADDR: "{{ 'https://127.0.0.1:8501' if security_phase != 'disabled' else 'http://127.0.0.1:8500' }}"
  CONSUL_CACERT: "{{ '/etc/consul.d/pki/ca.pem' if security_phase != 'disabled' else '' }}"
  CONSUL_CLIENT_CERT: "{{ '/etc/consul.d/pki/consul.pem' if security_phase != 'disabled' else '' }}"
  CONSUL_CLIENT_KEY: "{{ '/etc/consul.d/pki/consul-key.pem' if security_phase != 'disabled' else '' }}"
  CONSUL_TLS_SERVER_NAME: "{{ 'server.dc1.consul' if security_phase != 'disabled' else '' }}"
  CONSUL_HTTP_TOKEN: "{{ consul_management_token if security_phase != 'disabled' else '' }}"
  NOMAD_ADDR: "{{ 'https://127.0.0.1:4646' if security_phase in ['nomad-transition', 'enforced'] else 'http://127.0.0.1:4646' }}"
  NOMAD_CACERT: "{{ '/etc/nomad.d/pki/nomad-ca.pem' if security_phase in ['nomad-transition', 'enforced'] else '' }}"
  NOMAD_CLIENT_CERT: "{{ '/etc/nomad.d/pki/nomad.pem' if security_phase in ['nomad-transition', 'enforced'] else '' }}"
  NOMAD_CLIENT_KEY: "{{ '/etc/nomad.d/pki/nomad-key.pem' if security_phase in ['nomad-transition', 'enforced'] else '' }}"
  NOMAD_TLS_SERVER_NAME: "{{ 'server.global.nomad' if security_phase in ['nomad-transition', 'enforced'] else '' }}"
  NOMAD_TOKEN: "{{ nomad_management_token if security_phase in ['nomad-transition', 'enforced'] else '' }}"

postgres_cluster_name: norn-pg-ha
postgres_database: norn_test
postgres_database_user: norn_test
durability_database: norn_durability
durability_database_user: norn_durability
postgres_archive_mode: "{{ 's3' if backup_bucket | length > 0 else 'local' }}"

prometheus_image: "prom/prometheus@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893"
grafana_image: "grafana/grafana@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63"
cadvisor_image: "ghcr.io/google/cadvisor@sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe"
cosign_version: "3.1.2"
cosign_linux_amd64_sha256: "f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf"
trivy_version: "0.73.0"
trivy_linux_amd64_deb_sha256: "eedaeac48a2e3ac8054f5fa1db36caafd5033dc60d286fef269c06a2468420c0"
sops_version: "3.13.3"
sops_linux_amd64_sha256: "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b"
